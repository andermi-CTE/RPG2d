<script>

  isPressed(code) {

  update() {
    this.pressed = {};

  }

const INPUT_CODES = [
  "KeyW", "KeyA", "KeyS", "KeyD", "KeyR", "KeyJ", "KeyF", "KeyI", "KeyK", "KeyL", "KeyQ", "KeyH",
  "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
  "Enter", "KeyE", "Escape", "Space", "Tab", "Backspace",
  "KeyY", "KeyN",
  "ShiftLeft", "ShiftRight", "F1", "F2", "F3",
  "Digit0", "Digit1", "Digit2", "Digit3", "Digit4",
  "Digit5", "Digit6", "Digit7", "Digit8", "Digit9",
  "Numpad0", "Numpad1", "Numpad2", "Numpad3", "Numpad4",
  "Numpad5", "Numpad6", "Numpad7", "Numpad8", "Numpad9"
];

  if (INPUT_CODES.includes(event.code)) {

<script>
// TEACHER-OWNED: rectangle overlap and wall sliding.
function isColliding(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

// Horizontal and vertical movement are resolved separately so the player
// can slide along walls instead of getting stuck in corners.
function moveWithCollision(entity, dx, dy, solids) {
  if (!solids || solids.length === 0) {
    entity.x += dx;
    entity.y += dy;
    return;
  }

  entity.x += dx;
  for (let i = 0; i < solids.length; i++) {
    const solid = solids[i];
    if (isColliding(entity, solid)) {
      if (dx > 0) {
        entity.x = solid.x - entity.width;
      } else if (dx < 0) {
        entity.x = solid.x + solid.width;
      }
    }
  }

  entity.y += dy;
  for (let i = 0; i < solids.length; i++) {
    const solid = solids[i];
    if (isColliding(entity, solid)) {
      if (dy > 0) {
        entity.y = solid.y - entity.height;
      } else if (dy < 0) {
        entity.y = solid.y + solid.height;
      }
    }
  }
}

function drawCollisionBox(ctx, rect, camera) {
  if (!gameState.settings.showCollision) {
    return;
  }

  const camX = camera ? camera.x : 0;
  const camY = camera ? camera.y : 0;

  ctx.strokeStyle = "#ff4444";
  ctx.lineWidth = 1;
  ctx.strokeRect(rect.x - camX, rect.y - camY, rect.width, rect.height);
}

</script>
<script>
// TEACHER-OWNED: gravity and ground checks for platformer levels.
function applyGravity(entity, gravity, maxFallSpeed) {
  entity.vy += gravity;
  if (entity.vy > maxFallSpeed) {
    entity.vy = maxFallSpeed;
  }
}

function isOnGround(entity, solids) {
  const probe = {
    x: entity.x + 2,
    y: entity.y + entity.height,
    width: entity.width - 4,
    height: 2
  };
  for (let i = 0; i < solids.length; i++) {
    if (isColliding(probe, solids[i])) {
      return true;
    }
  }
  return false;
}

</script>
<script>
// TEACHER-OWNED: camera follows the player on the overworld without moving world coords.
class Camera {
  constructor(viewWidth, viewHeight, worldWidth, worldHeight) {
    this.x = 0;
    this.y = 0;
    this.width = viewWidth;
    this.height = viewHeight;
    this.worldWidth = worldWidth;
    this.worldHeight = worldHeight;
  }

  follow(target) {
    this.x = target.x + target.width / 2 - this.width / 2;
    this.y = target.y + target.height / 2 - this.height / 2;
    this.x = Math.max(0, Math.min(this.x, this.worldWidth - this.width));
    this.y = Math.max(0, Math.min(this.y, this.worldHeight - this.height));
  }
}

</script>

<script>
// TEACHER-OWNED: fade-to-black when changing scenes.
const transition = {
  active: false,
  alpha: 0,
  direction: "out",
  speed: 0.05,
  nextScene: null,
  switched: false
};

function startTransition(nextSceneName) {
  transition.active = true;
  transition.alpha = 0;
  transition.direction = "out";
  transition.nextScene = nextSceneName;
  transition.switched = false;
}

function updateTransition() {
  if (!transition.active) {
    return;
  }

  if (transition.direction === "out") {
    transition.alpha += transition.speed;
    if (transition.alpha >= 1) {
      transition.alpha = 1;
      if (!transition.switched && transition.nextScene) {
        sceneManager.changeSceneImmediate(transition.nextScene);
        transition.switched = true;
      }
      transition.direction = "in";
    }
  } else {
    transition.alpha -= transition.speed;
    if (transition.alpha <= 0) {
      transition.alpha = 0;
      transition.active = false;
      transition.nextScene = null;
      transition.switched = false;
    }
  }
}

function drawTransition(ctx) {
  if (!transition.active || transition.alpha <= 0) {
    return;
  }

  ctx.fillStyle = "rgba(0, 0, 0, " + transition.alpha + ")";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function isTransitionBlockingInput() {
  return transition.active && transition.alpha > 0.4;
}

</script>
<script>
// TEACHER-OWNED: F1 overlay, F2 collision boxes, F3 student pack report.
const debugStats = {
  frameCount: 0,
  elapsed: 0,
  fps: 0
};

function updateDebugStats(deltaTime) {
  debugStats.frameCount += 1;
  debugStats.elapsed += deltaTime;
  if (debugStats.elapsed >= 500) {
    debugStats.fps = Math.round((debugStats.frameCount * 1000) / debugStats.elapsed);
    debugStats.frameCount = 0;
    debugStats.elapsed = 0;
  }
}

function handleDebugInput() {
  if (input.isPressed("F1")) {
    gameState.settings.debugMode = !gameState.settings.debugMode;
  }
  if (input.isPressed("F2")) {
    gameState.settings.showCollision = !gameState.settings.showCollision;
  }
  if (input.isPressed("F3")) {
    gameState.settings.showPackReport = !gameState.settings.showPackReport;
  }
}

// Students run from the browser only, so pack problems have to be visible in the game itself.
function buildPackReportLines() {
  const summary = getPackReportSummary();
  const lines = [
    "STUDENT PACK REPORT  (F3 to close)",
    summary.loaded + " loaded   " + summary.rejected + " rejected   " + summary.warned + " with warnings",
    ""
  ];

  if (summary.rejected === 0 && summary.warned === 0) {
    lines.push("All packs loaded cleanly.");
    return lines;
  }

  for (let i = 0; i < studentPackReports.length; i++) {
    const report = studentPackReports[i];
    if (report.status !== "rejected") {
      continue;
    }
    lines.push("REJECTED  " + report.id);
    for (let e = 0; e < report.errors.length; e++) {
      lines.push("   " + report.errors[e]);
    }
  }

  for (let i = 0; i < studentPackReports.length; i++) {
    const report = studentPackReports[i];
    if (report.status === "rejected" || report.warnings.length === 0) {
      continue;
    }
    lines.push("WARNING   " + report.id);
    for (let w = 0; w < report.warnings.length; w++) {
      lines.push("   " + report.warnings[w]);
    }
  }

  return lines;
}

function drawPackReport(ctx) {
  if (!gameState.settings.showPackReport) {
    return;
  }

  const lines = buildPackReportLines();
  const maxLines = 30;
  const shown = lines.slice(0, maxLines);
  if (lines.length > maxLines) {
    shown.push("... " + (lines.length - maxLines) + " more lines, press F12 for the console");
  }

  ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = "13px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";

  for (let i = 0; i < shown.length; i++) {
    const line = shown[i];
    if (line.indexOf("REJECTED") === 0) {
      ctx.fillStyle = "#ff6b6b";
    } else if (line.indexOf("WARNING") === 0) {
      ctx.fillStyle = "#f1c40f";
    } else if (i === 0) {
      ctx.fillStyle = "#00ff88";
    } else {
      ctx.fillStyle = "#dddddd";
    }
    ctx.fillText(line.slice(0, 104), 16, 16 + i * 16);
  }
}

function drawDebugOverlay(ctx, info) {
  if (!gameState.settings.debugMode) {
    return;
  }

  const lines = [
    "FPS: " + debugStats.fps,
    "Scene: " + (info.sceneName || "unknown"),
    "Player: " + Math.round(info.playerX || 0) + ", " + Math.round(info.playerY || 0),
    "Camera: " + Math.round(info.cameraX || 0) + ", " + Math.round(info.cameraY || 0),
    "Collision count: " + (info.collisionCount || 0),
    "Homes registered: " + (info.homeCount || 0),
    "Homes visited: " + gameState.visitedHomes.length,
    "Badges: " + gameState.unlockedRewards.length,
    "Coins: " + (gameState.coins || 0),
    "Debug overlay: " + (gameState.settings.debugMode ? "ON" : "OFF"),
    "Collision boxes: " + (gameState.settings.showCollision ? "ON" : "OFF")
  ];

  ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
  ctx.fillRect(8, 8, 280, lines.length * 18 + 12);

  ctx.fillStyle = "#00ff88";
  ctx.font = "14px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";

  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], 16, 16 + i * 18);
  }
}

<script>
// TEACHER-OWNED: save progress in the browser (localStorage), one key per file slot.
const SAVE_SCHEMA_VERSION = 2;
// Standalone projects on the same website must not overwrite one another or the hub.
const SAVE_STORAGE_PREFIX = typeof window !== "undefined" && window.FVGD_STANDALONE
  ? "fvgd.standalone." + window.FVGD_STANDALONE.packId + ".slot."
  : "fvgd.save.slot.";

function slotStorageKey(slotIndex) {
  const slot = slotIndex || authState.activeSlot || 1;
  return SAVE_STORAGE_PREFIX + slot;
}

function defaultOverworldPosition() {
  return { x: 160, y: 160 };
}

function resetGameProgress() {
  gameState.visitedHomes = [];
  gameState.completedLevels = [];
  gameState.unlockedRewards = [];
  gameState.coins = 0;
  gameState.overworldPlayerPosition = defaultOverworldPosition();
  if (authState.displayName) {
    gameState.playerName = authState.displayName;
  }
}

function buildSavePayload() {
  return {
    schema_version: SAVE_SCHEMA_VERSION,
    visitedHomes: gameState.visitedHomes.slice(),
    completedLevels: gameState.completedLevels.slice(),
    unlockedRewards: gameState.unlockedRewards.slice(),
    coins: gameState.coins || 0,
    overworldPlayerPosition: {
      x: gameState.overworldPlayerPosition.x,
      y: gameState.overworldPlayerPosition.y
    },
    settings: {
      volume: gameState.settings.volume,
      debugMode: gameState.settings.debugMode,
      showCollision: gameState.settings.showCollision
    },
    playerName: gameState.playerName,
    updatedAt: new Date().toISOString()
  };
}

function applySavePayload(payload) {
  if (!payload) return false;
  gameState.visitedHomes = payload.visitedHomes || [];
  gameState.completedLevels = payload.completedLevels || [];
  gameState.unlockedRewards = payload.unlockedRewards || [];
  gameState.coins = typeof payload.coins === "number" ? payload.coins : 0;
  gameState.overworldPlayerPosition = payload.overworldPlayerPosition || defaultOverworldPosition();
  if (payload.settings) {
    gameState.settings.volume = payload.settings.volume ?? gameState.settings.volume;
    gameState.settings.debugMode = payload.settings.debugMode ?? gameState.settings.debugMode;
    gameState.settings.showCollision = payload.settings.showCollision ?? gameState.settings.showCollision;
  }
  if (payload.playerName) {
    gameState.playerName = payload.playerName;
  }
  return true;
}

function isOccupiedSave(payload) {
  if (!payload) {
    return false;
  }
  return (
    (payload.visitedHomes && payload.visitedHomes.length > 0) ||
    (payload.completedLevels && payload.completedLevels.length > 0) ||
    (payload.unlockedRewards && payload.unlockedRewards.length > 0) ||
    (payload.coins || 0) > 0
  );
}

function saveLocal() {
  try {
    localStorage.setItem(slotStorageKey(), JSON.stringify(buildSavePayload()));
    return true;
  } catch (err) {
    console.warn("saveLocal failed:", err);
    return false;
  }
}

function loadLocal(slotIndex) {
  try {
    const raw = localStorage.getItem(slotStorageKey(slotIndex));
    if (!raw) return false;
    return applySavePayload(JSON.parse(raw));
  } catch (err) {
    console.warn("loadLocal failed:", err);
    return false;
  }
}

function readLocalSlot(slotIndex) {
  try {
    const raw = localStorage.getItem(slotStorageKey(slotIndex));
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

function clearLocal(slotIndex) {
  localStorage.removeItem(slotStorageKey(slotIndex));
}

function saveGameProgress() {
  saveLocal();
  if (typeof saveCloud === "function") {
    saveCloud();
  }
}

</script>
<script>
// TEACHER-OWNED: student pack checks shared by the in-game F3 report and scripts/validate-packs.js.
// Errors quarantine a pack (it will not load). Warnings still load but show up in the report.
const PACK_ICON_COLORS = ["purple", "blue", "orange", "gray", "green", "red", "yellow"];
const PACK_INTERACTABLE_TYPES = ["npc", "portal", "exit", "savePoint", "submitPoint"];
const PACK_LEVEL_MODES = ["platformer", "topdown", "arena", "sports", "basketball", "soccer", "football", "ranch"];
const PACK_ID_PATTERN = /^[a-z0-9_]+$/;
const PACK_MIN_ROOM_SIZE = 5;
const PACK_MAX_ROOM_SIZE = 40;

function packIsNumber(value) {
  return typeof value === "number" && isFinite(value);
}

function packIsPositive(value) {
  return packIsNumber(value) && value > 0;
}

function packIsText(value) {
  return typeof value === "string" && value.trim().length > 0;
}

function createPackReport(packId) {
  return {
    id: packId || "(unknown)",
    status: "loaded",
    errors: [],
    warnings: []
  };
}

function checkManifest(manifest, report) {
  if (!manifest || typeof manifest !== "object") {
    report.errors.push("manifest: missing manifest object");
    return;
  }

  if (!packIsText(manifest.id)) {
    report.errors.push("manifest.id: missing or not a string");
  } else if (!PACK_ID_PATTERN.test(manifest.id)) {
    report.errors.push(
      "manifest.id: '" + manifest.id + "' must be lowercase letters, numbers, and underscores only"
    );
  }

  // A missing position crashes the overworld draw loop for the whole class.
  const pos = manifest.position;
  if (!pos || typeof pos !== "object") {
    report.errors.push("manifest.position: missing (needs { x: number, y: number })");
  } else if (!packIsNumber(pos.x) || !packIsNumber(pos.y)) {
    report.errors.push("manifest.position: x and y must be numbers");
  }

  if (!packIsText(manifest.name)) {
    report.warnings.push("manifest.name: missing, prompts will show the id instead");
  }
  if (!packIsText(manifest.author)) {
    report.warnings.push("manifest.author: missing");
  }
  if (manifest.iconColor !== undefined && PACK_ICON_COLORS.indexOf(manifest.iconColor) === -1) {
    report.warnings.push(
      "manifest.iconColor: '" + manifest.iconColor + "' is not one of " + PACK_ICON_COLORS.join(", ")
    );
  }
  if (manifest.width !== undefined && !packIsPositive(manifest.width)) {
    report.warnings.push("manifest.width: must be a positive number, defaulting to 32");
  }
  if (manifest.height !== undefined && !packIsPositive(manifest.height)) {
    report.warnings.push("manifest.height: must be a positive number, defaulting to 32");
  }
}

function checkInteractable(item, index, pack, report) {
  const label = "home.interactables[" + index + "]";

  if (!item || typeof item !== "object") {
    report.errors.push(label + ": not an object");
    return null;
  }
  if (PACK_INTERACTABLE_TYPES.indexOf(item.type) === -1) {
    report.errors.push(
      label + ": type '" + item.type + "' is not one of " + PACK_INTERACTABLE_TYPES.join(", ")
    );
    return null;
  }
  if (!packIsNumber(item.tileX) || !packIsNumber(item.tileY)) {
    report.errors.push(label + " (" + item.type + "): tileX and tileY must be numbers");
    return null;
  }
  if (!packIsText(item.id)) {
    report.warnings.push(label + " (" + item.type + "): missing id");
  }
  if (item.width !== undefined && !packIsPositive(item.width)) {
    report.warnings.push(label + " (" + item.type + "): width must be positive, defaulting to 32");
  }
  if (item.height !== undefined && !packIsPositive(item.height)) {
    report.warnings.push(label + " (" + item.type + "): height must be positive, defaulting to 32");
  }

  if (item.type === "npc") {
    if (!packIsText(item.dialogueKey)) {
      report.warnings.push(label + " (npc): missing dialogueKey, this NPC will not talk");
    } else if (!pack.dialogue || !pack.dialogue[item.dialogueKey]) {
      report.warnings.push(
        label + " (npc): dialogueKey '" + item.dialogueKey + "' is not in this pack's dialogue block"
      );
    }
  }

  if (item.type === "portal") {
    const levelId = item.levelId || item.platformerLevelId || (pack.manifest && (pack.manifest.levelId || pack.manifest.platformerLevelId));
    if (!packIsText(levelId)) {
      report.warnings.push(label + " (portal): no levelId, portal shows a placeholder message");
    }
  }

  return item.type;
}

function checkHome(pack, report) {
  const home = pack.home;

  if (!home || typeof home !== "object") {
    report.errors.push("home: missing home object");
    return;
  }

  const width = home.width === undefined ? 20 : home.width;
  const height = home.height === undefined ? 12 : home.height;

  if (!packIsPositive(width) || !packIsPositive(height)) {
    report.errors.push("home.width / home.height: must be positive numbers");
  } else if (width < PACK_MIN_ROOM_SIZE || height < PACK_MIN_ROOM_SIZE) {
    report.warnings.push(
      "home: room is smaller than " + PACK_MIN_ROOM_SIZE + " tiles, walls may trap the player"
    );
  } else if (width > PACK_MAX_ROOM_SIZE || height > PACK_MAX_ROOM_SIZE) {
    report.warnings.push("home: room is larger than " + PACK_MAX_ROOM_SIZE + " tiles and will overflow the canvas");
  }

  const spawn = home.spawnTile;
  if (spawn && (!packIsNumber(spawn.x) || !packIsNumber(spawn.y))) {
    report.warnings.push("home.spawnTile: x and y must be numbers, using the default spawn");
  } else if (spawn && (spawn.x < 1 || spawn.y < 1 || spawn.x > width - 2 || spawn.y > height - 2)) {
    report.warnings.push("home.spawnTile: outside the walls, the spawn will be moved inside");
  }

  if (!Array.isArray(home.interactables)) {
    report.errors.push("home.interactables: missing or not an array");
    return;
  }

  const seen = {};
  for (let i = 0; i < home.interactables.length; i++) {
    const type = checkInteractable(home.interactables[i], i, pack, report);
    if (type) {
      seen[type] = (seen[type] || 0) + 1;
    }
  }

  if (!seen.exit) {
    report.warnings.push("home: no working exit tile, players can only leave with Escape");
  }
  if (!seen.npc) {
    report.warnings.push("home: no working npc tile");
  }
  if (!seen.portal) {
    report.warnings.push("home: no working portal tile, the game cannot be reached");
  }
  if (!seen.savePoint) {
    report.warnings.push("home: no working savePoint tile");
  }
  if (!seen.submitPoint) {
    report.warnings.push("home: no working submitPoint tile, work cannot be submitted for review");
  }
}

function checkDialogue(pack, report) {
  const dialogue = pack.dialogue;
  if (dialogue === undefined) {
    return;
  }
  if (typeof dialogue !== "object" || dialogue === null || Array.isArray(dialogue)) {
    report.errors.push("dialogue: must be an object of { key: { speaker, lines } }");
    return;
  }

  const keys = Object.keys(dialogue);
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    const entry = dialogue[key];
    const label = "dialogue." + key;

    if (!entry || typeof entry !== "object") {
      report.errors.push(label + ": not an object");
      continue;
    }
    if (!packIsText(entry.speaker)) {
      report.warnings.push(label + ": missing speaker name");
    }
    if (!Array.isArray(entry.lines) || entry.lines.length === 0) {
      report.errors.push(label + ": lines must be a non-empty array of strings");
      continue;
    }
    for (let j = 0; j < entry.lines.length; j++) {
      if (!packIsText(entry.lines[j])) {
        report.warnings.push(label + ": line " + j + " is empty");
      }
    }
  }
}

function checkRect(rect, label, report, required) {
  if (!rect || typeof rect !== "object") {
    if (required) {
      report.errors.push(label + ": missing");
    }
    return false;
  }
  if (!packIsNumber(rect.x) || !packIsNumber(rect.y)) {
    report.errors.push(label + ": x and y must be numbers");
    return false;
  }
  if (!packIsPositive(rect.width) || !packIsPositive(rect.height)) {
    report.errors.push(label + ": width and height must be positive numbers");
    return false;
  }
  return true;
}

function checkLevel(pack, report) {
  const level = pack.level;
  if (level === undefined) {
    return;
  }
  if (typeof level !== "object" || level === null) {
    report.errors.push("level: must be an object");
    return;
  }

  const mode = level.mode === undefined ? "platformer" : level.mode;
  if (PACK_LEVEL_MODES.indexOf(mode) === -1) {
    report.errors.push(
      "level.mode: '" + mode + "' is not supported yet, use one of " + PACK_LEVEL_MODES.join(", ")
    );
  }

  if (!level.spawn || !packIsNumber(level.spawn.x) || !packIsNumber(level.spawn.y)) {
    report.errors.push("level.spawn: missing (needs { x: number, y: number })");
  }

  checkRect(level.goal, "level.goal", report, true);

  if (!Array.isArray(level.solids) || (mode === "platformer" && level.solids.length === 0)) {
    report.errors.push("level.solids: must be an array (platformers need at least one platform)");
  } else {
    for (let i = 0; i < level.solids.length; i++) {
      checkRect(level.solids[i], "level.solids[" + i + "]", report, true);
    }
  }

  if (level.hazards !== undefined) {
    if (!Array.isArray(level.hazards)) {
      report.errors.push("level.hazards: must be an array");
    } else {
      for (let h = 0; h < level.hazards.length; h++) {
        checkRect(level.hazards[h], "level.hazards[" + h + "]", report, true);
      }
    }
  }
}

// Structural checks for a single pack, with no knowledge of the rest of the class.
function validatePack(pack) {
  const report = createPackReport(pack && pack.manifest ? pack.manifest.id : null);

  if (!pack || typeof pack !== "object") {
    report.errors.push("pack: registerStudentPack needs an object");
    report.status = "rejected";
    return report;
  }

  checkManifest(pack.manifest, report);
  checkHome(pack, report);
  checkDialogue(pack, report);
  checkLevel(pack, report);
  checkLevelObjectives(pack, report);
  checkGameRoutingAndBounds(pack, report);
  checkArenaCombat(pack, report);
  checkSportsChallenge(pack, report);
  checkBasketball(pack, report);
  checkSoccer(pack, report);
  checkFootball(pack, report);
  checkRanch(pack, report);
  checkShooter(pack, report);
  checkPursuit(pack, report);
  checkQuestInteractions(pack, report);

  report.status = report.errors.length > 0 ? "rejected" : "loaded";
  return report;
}

function rectsOverlap(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

// Cross-pack checks that only make sense once the whole class is loaded.
function validatePackRegistry(packs) {
  const problems = [];
  const byId = {};
  const levelIds = {};
  const icons = [];

  for (let i = 0; i < packs.length; i++) {
    const manifest = packs[i].manifest;
    if (!manifest || !manifest.id) {
      continue;
    }

    if (byId[manifest.id]) {
      problems.push({
        id: manifest.id,
        message: "duplicate manifest.id '" + manifest.id + "' (ids must be unique across the class)"
      });
    }
    byId[manifest.id] = true;

    const levelId = manifest.levelId || manifest.platformerLevelId || (packs[i].level && packs[i].level.id);
    if (levelId) {
      if (levelIds[levelId]) {
        problems.push({
          id: manifest.id,
          message: "platformerLevelId '" + levelId + "' is already used by " + levelIds[levelId]
        });
      } else {
        levelIds[levelId] = manifest.id;
      }
    }

    if (manifest.position && packIsNumber(manifest.position.x)) {
      icons.push({
        id: manifest.id,
        x: manifest.position.x,
        y: manifest.position.y,
        width: manifest.width || 32,
        height: manifest.height || 32
      });
    }
  }

  for (let a = 0; a < icons.length; a++) {
    for (let b = a + 1; b < icons.length; b++) {
      if (rectsOverlap(icons[a], icons[b])) {
        problems.push({
          id: icons[a].id,
          message: "overworld icon overlaps " + icons[b].id + " — give one of them a new manifest.position"
        });
      }
    }
  }

  return problems;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { validatePack: validatePack, validatePackRegistry: validatePackRegistry };
}

// Optional version-1 objective fields. Old packs may omit every one of these.
// Validate references before play so a misspelled key cannot silently lock a game.
function checkLevelObjectives(pack, report) {
  if (pack.schemaVersion !== undefined && pack.schemaVersion !== 1) {
    report.errors.push("schemaVersion: only version 1 is supported");
  }
  const level = pack.level;
  if (!level || typeof level !== "object") return;
  function list(name) {
    if (level[name] === undefined) return [];
    if (!Array.isArray(level[name])) {
      report.errors.push("level." + name + ": must be an array");
      return [];
    }
    return level[name];
  }
  function ids(items, name, rectangles) {
    const known = new Set();
    items.forEach(function (item, index) {
      const label = "level." + name + "[" + index + "]";
      if (!item || !packIsText(item.id) || !PACK_ID_PATTERN.test(item.id)) {
        report.errors.push(label + ": needs an ID using lowercase letters, numbers and underscores");
        return;
      }
      if (known.has(item.id)) report.errors.push(label + ": duplicate id " + item.id);
      known.add(item.id);
      if (rectangles) checkRect(item, label, report, true);
    });

  }

    if (refs === undefined && !required) return;
    if (!Array.isArray(refs) || (required && refs.length === 0)) {
      report.errors.push(label + ": must be " + (required ? "a non-empty" : "an") + " array of IDs");
      return;
    }
    if (new Set(refs).size !== refs.length) report.errors.push(label + ": repeated IDs");
    refs.forEach(function (id) {
      if (!known.has(id)) report.errors.push(label + ": unknown ID " + id);
    });
  }
  const collectibles = list("collectibles");
  const objectives = list("objectives");
  const doors = list("doors");
  const interactions = list("interactions");
  const interactionIds = ids(interactions,"interactions",true);
  const itemIds = ids(collectibles, "collectibles", true);
  const objectiveIds = ids(objectives, "objectives", false);
  ids(doors, "doors", true);
  objectives.forEach(function (objective, index) {
    if (!objective || typeof objective !== "object") return;
    if (!packIsText(objective.label)) report.errors.push("objective " + index + ": needs a readable label");
    references(objective.collect, itemIds, "objective " + index + ".collect", !(Array.isArray(objective.interact) && objective.interact.length));
    references(objective.interact, interactionIds, "objective " + index + ".interact", !(Array.isArray(objective.collect) && objective.collect.length));
  });
  doors.forEach(function (door, index) {
    if (door && typeof door === "object") references(door.requires, objectiveIds, "door " + index + ".requires", false);
  });
  interactions.forEach((item,index)=>{
    if(!item||typeof item!=="object")return;
    references(item.requires,objectiveIds,"interaction "+index+".requires",false);
    references(item.needs,itemIds,"interaction "+index+".needs",false);
  });
  collectibles.forEach(item=>{if(item&&item.revealBy!==undefined&&!interactionIds.has(item.revealBy))report.errors.push("collectible.revealBy: unknown interaction ID");});
  if (level.goal) references(level.goal.requires, objectiveIds, "goal.requires", false);
}

// New mode-neutral IDs must not disagree with a legacy alias or the pack's level.
function checkGameRoutingAndBounds(pack, report) {
  const manifest = pack.manifest || {};
  const level = pack.level;
  const expected = level && (level.id || manifest.id + "_level");
  function checkRoute(item, label) {
    if (!item) return;
    if (item.levelId !== undefined && !packIsText(item.levelId)) report.errors.push(label + ".levelId: must be text");
    if (item.levelId && item.platformerLevelId && item.levelId !== item.platformerLevelId) {
      report.errors.push(label + ": levelId disagrees with platformerLevelId");
    }
    const target = item.levelId || item.platformerLevelId;
    if (expected && target && target !== expected) report.errors.push(label + ": portal target must match this pack's level.id");
  }
  checkRoute(manifest, "manifest");
  ((pack.home && Array.isArray(pack.home.interactables)) ? pack.home.interactables : []).forEach(function (item) {
    if (item && item.type === "portal") checkRoute(item, "portal");
  });
  if (!level || (level.mode !== "topdown" && level.mode !== "arena")) return;
  // This template has no scrolling camera. Reject hidden/out-of-screen objectives.
  if (!Number.isInteger(level.width) || level.width < 64 || level.width > 960 ||
      !Number.isInteger(level.height) || level.height < 64 || level.height > 640) {
    report.errors.push("walking modes: width must be 64..960 and height 64..640, in whole pixels");
    return;
  }
  function inside(rect, label) {
    if (!rect || !packIsNumber(rect.x) || !packIsNumber(rect.y) || !packIsPositive(rect.width) || !packIsPositive(rect.height)) return;
    if (rect.x < 0 || rect.y < 0 || rect.x + rect.width > level.width || rect.y + rect.height > level.height) {
      report.errors.push(label + ": rectangle must fit inside the level");
    }
  }
  inside(level.goal, "goal");
  const spawn = level.spawn && {x:level.spawn.x, y:level.spawn.y, width:28, height:28};
  inside(spawn, "spawn");
  ["solids", "hazards", "collectibles", "doors"].forEach(function (name) {
    if (Array.isArray(level[name])) level[name].forEach((rect,index) => inside(rect,name + "[" + index + "]"));
  });
  // Avoid spawning inside a wall, hazard or initially closed door.
  const blockers = [].concat(Array.isArray(level.solids) ? level.solids : [],
    Array.isArray(level.hazards) ? level.hazards : [],
    Array.isArray(level.doors) ? level.doors.filter(d => d && Array.isArray(d.requires) && d.requires.length) : []);
  if (spawn && blockers.some(rect => rect && rectsOverlap(spawn,rect))) report.errors.push("spawn: overlaps a wall, hazard or locked door");
}

// Arena settings are deliberately bounded so a typo cannot create an unplayable wave.
function checkArenaCombat(pack, report) {
  const level = pack.level;
  if (!level || (level.mode !== "arena" && level.combat === undefined)) return;
  const mode=level.mode || "platformer";
  if(!["arena","platformer","topdown"].includes(mode))report.errors.push("combat: use arena, platformer or topdown mode");
  if(level.shooter || level.pursuit)report.errors.push("combat: do not mix with shooter/pursuit in this version");
  const combat = level.combat;
  function number(value, min, max, label, integer) {
    if (!packIsNumber(value) || value < min || value > max || (integer && !Number.isInteger(value))) {
      report.errors.push(label + ": use " + (integer ? "a whole number " : "a number ") + min + ".." + max);
    }
  }
  if (!combat || typeof combat !== "object" || Array.isArray(combat)) report.errors.push("combat: missing settings object");
  else {
    number(combat.playerHealth,1,20,"combat.playerHealth",true);
    number(combat.attackDamage,1,10,"combat.attackDamage",true);
    number(combat.attackReach,16,96,"combat.attackReach",false);
    number(combat.attackCooldown,0.15,2,"combat.attackCooldown",false);
    number(combat.invulnerabilitySeconds,0.3,3,"combat.invulnerabilitySeconds",false);
  }
  if (!Array.isArray(level.waves) || level.waves.length < 1 || level.waves.length > 10) {
    report.errors.push("arena.waves: supply 1..10 waves");return;
  }
  const ids = new Set();
  const blockers = [].concat(Array.isArray(level.solids) ? level.solids : [],
    Array.isArray(level.hazards) ? level.hazards : [],
    Array.isArray(level.doors) ? level.doors.filter(d => d && Array.isArray(d.requires) && d.requires.length) : []);
  const spawn = level.spawn && {x:level.spawn.x,y:level.spawn.y,width:28,height:28};
  // Combat adventures are one screen too. Validate platformer layouts as strictly as walking ones.
  number(level.width,64,960,"combat level.width",true);number(level.height,64,640,"combat level.height",true);
  const rectangles=[spawn,level.goal].concat(blockers,Array.isArray(level.collectibles)?level.collectibles:[]);
  rectangles.forEach(rect=>{if(rect&&(rect.x<0||rect.y<0||rect.x+rect.width>level.width||rect.y+rect.height>level.height))report.errors.push("combat: layout rectangle outside level");});
  if(spawn&&blockers.some(rect=>rect&&rectsOverlap(spawn,rect)))report.errors.push("combat: player spawn overlaps blocker");
  level.waves.forEach(function (wave, w) {
    if (!wave || !Array.isArray(wave.enemies) || wave.enemies.length < 1 || wave.enemies.length > 8) {
      report.errors.push("wave " + w + ": supply 1..8 enemies");return;
    }
    wave.enemies.forEach(function (enemy, i) {
      const label = "wave " + w + " enemy " + i;
      if (!checkRect(enemy,label,report,true)) return;
      if (!packIsText(enemy.id) || !PACK_ID_PATTERN.test(enemy.id) || ids.has(enemy.id)) report.errors.push(label + ": use a unique lowercase enemy ID");
      ids.add(enemy.id);
      number(enemy.width,8,64,label + ".width",false);number(enemy.height,8,64,label + ".height",false);
      number(enemy.health,1,20,label + ".health",true);number(enemy.damage,1,10,label + ".damage",true);
      number(enemy.speed,0,160,label + ".speed",false);
      if(mode==="platformer" && !(Array.isArray(level.solids)?level.solids:[]).some(w=>w&&Math.abs(enemy.y+enemy.height-w.y)<0.1&&enemy.x>=w.x&&enemy.x+enemy.width<=w.x+w.width))report.errors.push(label+": platformer guard must start on solid ground");
      if (enemy.x < 0 || enemy.y < 0 || enemy.x + enemy.width > level.width || enemy.y + enemy.height > level.height) report.errors.push(label + ": spawn outside level");
      if (blockers.some(rect => rect && rectsOverlap(enemy,rect)) || (spawn && rectsOverlap(enemy,spawn))) report.errors.push(label + ": spawn overlaps a wall, hazard, locked door or player start");
      if (wave.enemies.slice(0,i).some(other => other && rectsOverlap(enemy,other))) report.errors.push(label + ": overlaps another enemy spawn in this wave");
    });
  });
}

// Sports uses spawn as the BALL launch point and goal as the hoop rim.
function checkSportsChallenge(pack, report) {
  const level = pack.level;
  if (!level || level.mode !== "sports") return;
  function range(value,min,max,label,integer) {
    if (!packIsNumber(value) || value < min || value > max || (integer && !Number.isInteger(value))) {
      report.errors.push(label + ": use " + (integer ? "a whole number " : "a number ") + min + ".." + max);
      return false;
    }
    return true;
  }
  // Keep this version one screen. Its background/scoreboard uses a 960x640 court.
  if (level.width !== 960 || level.height !== 640) report.errors.push("sports: use a 960 by 640 court");
  const c = level.challenge;
  if (!c || typeof c !== "object") {report.errors.push("sports: missing challenge settings");return;}
  range(c.targetScore,1,20,"challenge.targetScore",true);
  range(c.timeLimit,5,180,"challenge.timeLimit",false);
  range(c.startAngle,20,80,"challenge.startAngle",true);
  range(c.startPower,300,900,"challenge.startPower",true);
  range(c.gravity,100,1200,"challenge.gravity",false);
  range(c.ballRadius,6,18,"challenge.ballRadius",false);
  range(c.floorY,500,620,"challenge.floorY",false);
  const spawn=level.spawn, goal=level.goal;
  if (spawn && packIsNumber(spawn.x) && packIsNumber(spawn.y)) {
    if (spawn.x < 40 || spawn.x > 400 || spawn.y < 160 || spawn.y + c.ballRadius >= c.floorY-30) report.errors.push("sports.spawn: launch from x 40..400, below the HUD and above the floor");
  }
  if (goal && checkRect(goal,"sports.goal",report,true)) {
    if (goal.width < 2*c.ballRadius+16 || goal.width > 180 || goal.height > 24 || goal.x < 450 || goal.x+goal.width+26 > 950 || goal.y < 200 || goal.y+42 >= c.floorY) report.errors.push("sports.goal: fit a reachable-width hoop and backboard on the right side, between the HUD and floor");
    if (goal.requires && goal.requires.length) report.errors.push("sports.goal: collection requirements are not supported in this mode");
  }
  ["solids","hazards","collectibles","objectives","doors","waves"].forEach(name => {
    if (level[name] !== undefined && (!Array.isArray(level[name]) || level[name].length)) report.errors.push("sports: " + name + " must be empty; use challenge settings instead");
  });
  if (level.combat !== undefined) report.errors.push("sports: combat settings are not supported");
}

// Team basketball deliberately starts with three players per side and bounded stats.
function checkBasketball(pack,report){
  const level=pack.level;if(!level||level.mode!=="basketball")return;
  if(level.width!==960||level.height!==640)report.errors.push("basketball: use the 960x640 court");
  const b=level.basketball;if(!b||typeof b!=="object"){report.errors.push("basketball: missing settings");return;}

  number(b.meterCycles,0.3,2,"basketball.meterCycles",false);number(b.seed,1,4294967295,"basketball.seed",true);
  if(!Array.isArray(b.teams)||b.teams.length!==2){report.errors.push("basketball: exactly two teams required");return;}

    team.players.forEach((p,i)=>{

<script>
// TEACHER-OWNED: temporary progress for ONE attempt at a level.
// Students edit collectibles, objectives and doors in their own pack.js.
// Never change the pack itself during play: restart must restore every item.
function createLevelProgress() {
  return { collected: new Set(), interacted: new Set(), dialogue: null };
}

function collectLevelItems(level, progress, player) {
  for (const item of level.collectibles || []) {
    if (!progress.collected.has(item.id) && (!item.revealBy || progress.interacted.has(item.revealBy)) && isColliding(player, item)) {
      progress.collected.add(item.id);
    }
  }
}

// Objectives can require collected items, completed interactions, or both.
// Every listed ID is required; absent lists preserve older collection-only packs.
// IDs are local to this level, so two students can both name an item "key".
function isObjectiveComplete(level, progress, objectiveId) {
  const objective = (level.objectives || []).find(function (item) {
    return item.id === objectiveId;
  });
  return !!objective && (objective.collect || []).every(id => progress.collected.has(id)) &&
    (objective.interact || []).every(id => progress.interacted.has(id));
}

// Doors and the goal use the same rule. No requirements means always open.
// This default preserves packs created before objectives were introduced.
function areLevelRequirementsMet(level, progress, requirements) {
  return (requirements || []).every(function (id) {
    return isObjectiveComplete(level, progress, id);
  });
}

function getClosedLevelDoors(level, progress) {
  return (level.doors || []).filter(function (door) {
    return !areLevelRequirementsMet(level, progress, door.requires);
  });
}

// The HUD names the task and shows progress, so color is not the only clue.
function drawLevelObjectives(ctx, level, progress) {
  ctx.save();
  ctx.font = "16px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  (level.objectives || []).forEach(function (objective, index) {
    const found = (objective.collect || []).filter(id => progress.collected.has(id)).length +
      (objective.interact || []).filter(id => progress.interacted.has(id)).length;
    const total = (objective.collect || []).length + (objective.interact || []).length;
    const message = objective.label + ": " + found + "/" + total;
    // Keep tasks on the right so F1's teacher debug panel cannot cover them.
    const width = Math.min(610, ctx.measureText(message).width + 16);
    const left = canvas.width - width - 12;
    ctx.fillStyle = "#101827";
    ctx.fillRect(left, 12 + index * 26, width, 24);
    ctx.fillStyle = "white";
    ctx.fillText(message, left + 8, 16 + index * 26, width - 16);
  });
  ctx.restore();
}

</script>
<script>
// PUZZLE / QUEST interactions share the existing objective and door system.
// Students author level.interactions and objectives. Only progress changes during play.
function nearestQuestInteraction(level,progress,player){
  const walls=(level.solids||[]).concat(getClosedLevelDoors(level,progress));
  let target=null,distance=Infinity;
  for(const item of level.interactions||[]){
    const d=Math.hypot(player.x+player.width/2-item.x-item.width/2,player.y+player.height/2-item.y-item.height/2);
    // The closest visible interaction wins; authored order breaks ties predictably.
    if(d<=56&&d<distance&&!arenaWallBetween(player,item,walls)){target=item;distance=d;}
  }
  return target;
}
function activateQuestInteraction(level,progress,item){
  let text;
  if(progress.interacted.has(item.id))text=item.doneText;
  else if(!areLevelRequirementsMet(level,progress,item.requires)||!(item.needs||[]).every(id=>progress.collected.has(id)))text=item.lockedText;
  else{
    // Switches latch ON, clues stay read, deliveries stay complete. No soft-locking toggle.
    // Delivery uses the collection journal, not a consumable inventory: items remain recorded.
    progress.interacted.add(item.id);text=item.text;
  }
  progress.dialogue={title:item.label,text};
}
function drawQuestInteractions(ctx,level,progress,player){
  ctx.save();ctx.font="13px monospace";ctx.textAlign="left";ctx.textBaseline="bottom";
  for(const item of level.interactions||[]){
    const done=progress.interacted.has(item.id);
    ctx.fillStyle=done?"#4ade80":item.type==="npc"?"#60a5fa":item.type==="clue"?"#facc15":"#fb923c";
    ctx.fillRect(item.x,item.y,item.width,item.height);ctx.fillStyle="white";
    ctx.fillText(item.label+(done?" (done)":""),item.x,item.y-5);
  }
  const nearby=nearestQuestInteraction(level,progress,player);
  if(nearby&&!progress.dialogue){ctx.fillStyle="#101827";ctx.fillRect(180,540,600,32);ctx.fillStyle="white";ctx.textAlign="center";ctx.fillText("E: "+nearby.label,480,563);}
  if(progress.dialogue){
    ctx.fillStyle="rgba(10,18,33,0.98)";ctx.fillRect(48,390,864,190);ctx.strokeStyle="#94a3b8";ctx.strokeRect(48,390,864,190);
    ctx.fillStyle="white";ctx.textAlign="left";ctx.textBaseline="top";ctx.font="18px monospace";ctx.fillText(progress.dialogue.title,68,406);
    ctx.font="16px monospace";
    // Wrap by actual measured width; bounded text prevents the panel spilling off screen.
    const words=progress.dialogue.text.split(/\s+/);let line="",y=438;
    for(const word of words){const next=line?line+" "+word:word;if(ctx.measureText(next).width>820&&line){ctx.fillText(line,68,y);y+=21;line=word;}else line=next;}
    if(line)ctx.fillText(line,68,y);
    ctx.fillStyle="#93c5fd";ctx.fillText("E / Enter: close | R: restart | Esc: home",68,550);
  }
  ctx.restore();
}

</script>
<script>
// SHARED MELEE: arena, platformer and top-down adventure use this combat module.
// Movement mode still controls the player. Space stays jump in platformers; J strikes.
// Students edit level.combat and level.waves in pack.js, not this runtime state.
function createArenaCombat(level) {
  const state = {
    health: level.combat.playerHealth, wave: 0, enemies: [],
    cooldown: 0, attackTime: 0, attackBox: null, invulnerable: 0.8,
    waveDelay: 0, defeated: false, cleared: false
  };
  spawnArenaWave(level, state);
  return state;
}

function spawnArenaWave(level, state) {
  // Copy every enemy so damage never changes the student's original design.
  state.enemies = level.waves[state.wave].enemies.map(enemy => Object.assign({}, enemy, {hitStun:0}));
  state.invulnerable = Math.max(state.invulnerable, 0.8);
}

// The attack reaches in the direction the player last walked. It is not a projectile.
function arenaAttackBox(player, reach) {
  const cx = player.x + player.width / 2, cy = player.y + player.height / 2;
  if (player.facing === "left") return {x:cx-reach,y:player.y-6,width:reach,height:player.height+12};
  if (player.facing === "right") return {x:cx,y:player.y-6,width:reach,height:player.height+12};
  if (player.facing === "up") return {x:player.x-6,y:cy-reach,width:player.width+12,height:reach};
  return {x:player.x-6,y:cy,width:player.width+12,height:reach};
}

// A segment/rectangle test prevents melee damage through walls and locked doors.
function arenaWallBetween(player, enemy, walls) {
  const x = player.x + player.width / 2, y = player.y + player.height / 2;
  const dx = enemy.x + enemy.width / 2 - x, dy = enemy.y + enemy.height / 2 - y;
  return walls.some(wall => {
    let start = 0, end = 1;
    for (const [origin, delta, low, high] of [[x,dx,wall.x,wall.x+wall.width],[y,dy,wall.y,wall.y+wall.height]]) {
      if (delta === 0) { if (origin < low || origin > high) return false; }
      else {
        const a = (low-origin)/delta, b = (high-origin)/delta;
        start = Math.max(start, Math.min(a,b)); end = Math.min(end, Math.max(a,b));
        if (start > end) return false;
      }
    }
    return true;
  });
}

function updateArenaCombat(level, state, player, walls, seconds, attackPressed) {
  if (state.defeated || state.cleared) return;
  state.cooldown = Math.max(0, state.cooldown-seconds);
  state.attackTime = Math.max(0, state.attackTime-seconds);
  state.invulnerable = Math.max(0, state.invulnerable-seconds);
  if (state.waveDelay > 0) {
    state.waveDelay = Math.max(0, state.waveDelay-seconds);
    if (state.waveDelay === 0) { state.wave += 1; spawnArenaWave(level,state); }
    return;
  }
  // One press produces one strike. Holding the key never causes automatic damage.
  if (attackPressed && state.cooldown === 0) {
    state.cooldown = level.combat.attackCooldown;
    state.attackTime = 0.12;
    state.attackBox = arenaAttackBox(player, level.combat.attackReach);
    for (const enemy of state.enemies) {
      if (isColliding(state.attackBox,enemy) && !arenaWallBetween(player,enemy,walls)) {
        enemy.health -= level.combat.attackDamage;
        // A successful hit briefly interrupts contact damage, giving the player room to retreat.
        enemy.hitStun = 0.18;
      }
    }
    state.enemies = state.enemies.filter(enemy => enemy.health > 0);
  }
  // Enemies follow the player on one axis, sliding against walls. This is not maze AI.
  for (const enemy of state.enemies) {
    if(enemy.hitStun>0){enemy.hitStun=Math.max(0,enemy.hitStun-seconds);continue;}
    const dx = player.x+player.width/2 - (enemy.x+enemy.width/2);
    const dy = player.y+player.height/2 - (enemy.y+enemy.height/2);
    const step = enemy.speed * seconds;
    if((level.mode || "platformer") === "platformer"){
      // Ground guards walk horizontally, never fly toward a jumping player.
      // Check the leading foot so guards stop at ledges instead of floating over gaps.
      const move=Math.sign(dx)*Math.min(step,Math.abs(dx));
      const foot={x:move>=0?enemy.x+move+enemy.width-2:enemy.x+move,y:enemy.y+enemy.height,width:2,height:2};
      if(walls.some(w=>isColliding(foot,w)))moveWithCollision(enemy,move,0,walls);
    }else if (Math.abs(dx) > Math.abs(dy)) moveWithCollision(enemy,Math.sign(dx)*Math.min(step,Math.abs(dx)),0,walls);
    else moveWithCollision(enemy,0,Math.sign(dy)*Math.min(step,Math.abs(dy)),walls);
    enemy.x = Math.max(0,Math.min(level.width-enemy.width,enemy.x));
    enemy.y = Math.max(0,Math.min(level.height-enemy.height,enemy.y));
    // A grace period prevents several overlapping enemies from draining health instantly.
    if (state.invulnerable === 0 && isColliding(player,enemy)) {
      state.health = Math.max(0,state.health-enemy.damage);
      state.invulnerable = level.combat.invulnerabilitySeconds;
      if (state.health === 0) { state.defeated = true; return; }
    }
  }
  if (state.enemies.length === 0) {
    if (state.wave + 1 === level.waves.length) state.cleared = true;
    else state.waveDelay = 0.8;
  }
}

function drawArenaCombat(ctx, level, state, player) {
  ctx.save();
  ctx.font = "14px monospace"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  for (const enemy of state.enemies) {
    ctx.fillStyle = enemy.hitStun>0 ? "#fde047" : "#e87956";ctx.fillRect(enemy.x,enemy.y,enemy.width,enemy.height);
    ctx.fillStyle = "white";ctx.fillText("HP " + enemy.health,enemy.x,enemy.y-4);
  }
  if (state.attackTime > 0 && state.attackBox && !state.cleared && !state.defeated) {
    const box = state.attackBox;ctx.fillStyle = "rgba(253,224,71,0.55)";
    ctx.fillRect(box.x,box.y,box.width,box.height);
  }
  if (state.invulnerable > 0 && !state.defeated) {
    ctx.strokeStyle = "white";ctx.strokeRect(player.x-2,player.y-2,player.width+4,player.height+4);
  }
  // Keep the combat HUD below any collection objectives and clear of F1 debug text.
  const y = 16 + (level.objectives || []).length*26;
  const message = "HP " + state.health + "/" + level.combat.playerHealth + " | Wave " + (state.wave+1) + "/" + level.waves.length + " | Enemies " + state.enemies.length;
  ctx.fillStyle = "#101827";ctx.fillRect(420,y,528,54);
  ctx.fillStyle = "white";ctx.textBaseline = "top";ctx.fillText(message,430,y+5);
  ctx.fillText(state.defeated ? "Defeated: R to retry, Esc for home" : state.cleared ? "Enemies cleared! Finish tasks and reach exit." : state.waveDelay > 0 ? "Next wave incoming..." : ((level.mode || "platformer") === "platformer" ? "Tap J: strike | Space: jump | Face your target." : "Face a rival; tap J or Space to strike."),430,y+29);
  ctx.restore();
}

<script>
// SHARED SHOOTER: opt in with level.shooter in a platformer or top-down pack.
// The pack is a design. This copied state is one attempt, so R never edits the design.
function createShooter(level) {
  return {health:level.shooter.playerHealth, cooldown:0, invulnerable:0.8,
    bullets:[], enemies:level.shooter.enemies.map(e=>Object.assign({},e,{cooldown:e.fireInterval})),
    defeated:false, cleared:false, aim:{x:1,y:0}};
}
function shooterCenter(rect) {return {x:rect.x+rect.width/2,y:rect.y+rect.height/2};}

// Swept collision: find WHEN a moving bullet first touches a rectangle (0..1).
// Expanding the rectangle by the bullet radius prevents fast shots skipping thin walls.
function shooterHitTime(x,y,dx,dy,rect,radius) {
  let first=0,last=1;
  for(const [origin,delta,low,high] of [[x,dx,rect.x-radius,rect.x+rect.width+radius],[y,dy,rect.y-radius,rect.y+rect.height+radius]]) {
    if(delta===0){if(origin<low||origin>high)return null;}
    else {const a=(low-origin)/delta,b=(high-origin)/delta;
      first=Math.max(first,Math.min(a,b));last=Math.min(last,Math.max(a,b));
      if(first>last)return null;
    }
  }
  return first;
}
function shooterDirection(player,controls) {
  let x=(controls.aimRight?1:0)-(controls.aimLeft?1:0);
  let y=(controls.aimDown?1:0)-(controls.aimUp?1:0);
  if(!x&&!y){const facing={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[player.facing];[x,y]=facing||[1,0];}
  const length=Math.hypot(x,y);return {x:x/length,y:y/length};
}
function shooterAddBullet(state,from,direction,speed,damage,lifetime,team) {
  // A hard limit plus lifetime/bounds cleanup prevents an endless buildup of objects.
  if(state.bullets.length>=128)return;
  state.bullets.push({x:from.x,y:from.y,vx:direction.x*speed,vy:direction.y*speed,
    radius:4,damage,life:lifetime,team});
}
function shooterDamage(level,state,damage) {
  if(state.invulnerable>0)return;
  state.health=Math.max(0,state.health-damage);state.invulnerable=level.shooter.invulnerabilitySeconds;
  if(state.health===0){state.defeated=true;state.bullets=[];}
}
function updateShooter(level,state,player,walls,seconds,controls) {
  if(state.defeated||state.cleared)return;
  const config=level.shooter;
  state.cooldown=Math.max(0,state.cooldown-seconds);
  state.invulnerable=Math.max(0,state.invulnerable-seconds);
  state.aim=shooterDirection(player,controls);
  const center=shooterCenter(player);
  // Hold F to fire at a controlled rate. Space remains jump in the platformer.
  if(controls.fire&&state.cooldown===0){
    shooterAddBullet(state,center,state.aim,config.bulletSpeed,config.damage,config.bulletLifetime,"player");
    state.cooldown=config.fireInterval;
  }
  for(const enemy of state.enemies){
    enemy.cooldown=Math.max(0,enemy.cooldown-seconds);
    const from=shooterCenter(enemy),dx=center.x-from.x,dy=center.y-from.y,length=Math.hypot(dx,dy);
    // Turrets aim at the current position ONCE per shot; bullets never home afterward.
    // Walls and closed doors block sight. The yellow outline warns of an imminent shot.
    if(enemy.cooldown===0&&length>0&&!walls.some(w=>shooterHitTime(from.x,from.y,dx,dy,w,4)!==null)){
      shooterAddBullet(state,from,{x:dx/length,y:dy/length},enemy.bulletSpeed,enemy.damage,config.bulletLifetime,"enemy");
      enemy.cooldown=enemy.fireInterval;
    }
    if(isColliding(player,enemy))shooterDamage(level,state,enemy.damage);
    if(state.defeated)return;
  }
  const remaining=[];
  for(const bullet of state.bullets){
    const step=Math.min(seconds,bullet.life),dx=bullet.vx*step,dy=bullet.vy*step;
    let nearest=Infinity,target=null;
    // Check walls first so a tie cannot damage someone through cover.
    for(const wall of walls){const t=shooterHitTime(bullet.x,bullet.y,dx,dy,wall,bullet.radius);if(t!==null&&t<nearest){nearest=t;target="wall";}}
    const targets=bullet.team==="player"?state.enemies.filter(e=>e.health>0):[player];
    for(const actor of targets){const t=shooterHitTime(bullet.x,bullet.y,dx,dy,actor,bullet.radius);if(t!==null&&t<nearest){nearest=t;target=actor;}}
    if(target){
      if(target!=="wall"){
        if(bullet.team==="player")target.health-=bullet.damage;
        else shooterDamage(level,state,bullet.damage);
      }
      if(state.defeated)return;
      continue; // One projectile hits at most one actor. No unintended piercing.
    }
    bullet.x+=dx;bullet.y+=dy;bullet.life-=seconds;
    if(bullet.life>0&&bullet.x>=0&&bullet.x<=level.width&&bullet.y>=0&&bullet.y<=level.height)remaining.push(bullet);
  }
  state.bullets=remaining;state.enemies=state.enemies.filter(e=>e.health>0);
  if(state.enemies.length===0){state.cleared=true;state.bullets=[];}
}
function drawShooter(ctx,level,state,player){
  ctx.save();ctx.font="14px monospace";ctx.textAlign="left";ctx.textBaseline="top";
  for(const e of state.enemies){
    ctx.fillStyle="#e87956";ctx.fillRect(e.x,e.y,e.width,e.height);
    if(e.cooldown<0.35){ctx.strokeStyle="#fde047";ctx.lineWidth=3;ctx.strokeRect(e.x-2,e.y-2,e.width+4,e.height+4);}
    ctx.fillStyle="white";ctx.fillText("HP "+e.health,e.x,e.y-20);
  }
  for(const b of state.bullets){ctx.fillStyle=b.team==="player"?"#67e8f9":"#fb7185";ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();}
  if(!state.defeated){const c=shooterCenter(player);ctx.strokeStyle="#67e8f9";ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+state.aim.x*26,c.y+state.aim.y*26);ctx.stroke();}
  if(state.invulnerable>0&&!state.defeated){ctx.strokeStyle="white";ctx.strokeRect(player.x-2,player.y-2,player.width+4,player.height+4);}
  ctx.fillStyle="#101827";ctx.fillRect(360,12,590,76);ctx.fillStyle="white";
  ctx.fillText("HP "+state.health+"/"+level.shooter.playerHealth+" | Targets "+state.enemies.length,370,20);
  ctx.fillText("Hold F: fire | I J K L: aim | Move: WASD/arrows",370,43);
  ctx.fillText(state.defeated?"Defeated: R to retry, Esc for home":state.cleared?"Targets cleared! Finish tasks and reach gold exit.":"Cyan = your shots. Pink = enemy shots. Use cover.",370,65);
  ctx.restore();
}

</script>
<script>
// CHASE / SURVIVAL: optional level.pursuit module for platformer or top-down movement.
// Copy design data into attempt state: R resets enemies, the clock, and stun cooldown.
function createPursuit(level){return {enemies:level.pursuit.enemies.map(e=>Object.assign({},e,{memory:0,target:null,stunned:0})),remaining:level.pursuit.seconds,cooldown:0,flash:0,grace:1,hiding:false,defeated:false,reason:""};}
function pursuitHidden(level,player,hold){
  // Hide only when the WHOLE player is inside a marked refuge. No midair hiding.
  if(!hold||((level.mode||"platformer")==="platformer"&&!player.onGround))return false;
  return level.pursuit.hidingSpots.some(z=>player.x>=z.x&&player.y>=z.y&&player.x+player.width<=z.x+z.width&&player.y+player.height<=z.y+z.height);
}
function pursuitDistance(a,b){return Math.hypot(a.x+a.width/2-b.x-b.width/2,a.y+a.height/2-b.y-b.height/2);}
function updatePursuit(level,state,player,walls,seconds,controls){
  if(state.defeated)return;
  const c=level.pursuit;
  state.remaining=Math.max(0,state.remaining-seconds);state.cooldown=Math.max(0,state.cooldown-seconds);
  state.flash=Math.max(0,state.flash-seconds);state.grace=Math.max(0,state.grace-seconds);
  state.hiding=pursuitHidden(level,player,controls.hide);
  if(controls.stun&&state.cooldown===0){
    // You can flash from a refuge before releasing H, avoiding a frame-perfect escape.
    // A flash cannot pass through cover. Pressing Q spends the cooldown even on a miss.
    state.cooldown=c.stunCooldown;state.flash=0.25;
    for(const e of state.enemies)if(pursuitDistance(player,e)<=c.stunRadius&&!arenaWallBetween(player,e,walls)){
      e.stunned=c.stunSeconds;e.memory=0;e.target=null;
    }
  }
  for(const e of state.enemies){
    if(e.stunned>0){e.stunned=Math.max(0,e.stunned-seconds);continue;}
    const sees=!state.hiding&&pursuitDistance(player,e)<=e.noticeRadius&&!arenaWallBetween(player,e,walls);
    if(sees){e.target={x:player.x,y:player.y};e.memory=c.memorySeconds;}
    else e.memory=Math.max(0,e.memory-seconds);
    if(e.memory===0)e.target=null;
    if(e.target){
      const dx=e.target.x-e.x,dy=e.target.y-e.y,step=e.speed*seconds;
      if((level.mode||"platformer")==="platformer"){
        // Ground pursuers stop at walls and ledges; they do not fly or auto-jump gaps.
        const move=Math.sign(dx)*Math.min(step,Math.abs(dx));
        const probe={x:e.x+move,y:e.y,width:e.width,height:e.height};
        // Check the leading foot, not just any overlap beneath the body.
        const foot={x:move>=0?probe.x+probe.width-2:probe.x,y:probe.y+probe.height,width:2,height:2};
        if(walls.some(w=>isColliding(foot,w)))moveWithCollision(e,move,0,walls);
      }else{
        // Simple line-of-sight pursuit with wall sliding, not full maze pathfinding.
        const distance=Math.hypot(dx,dy);
        if(distance){const travel=Math.min(step,distance);moveWithCollision(e,dx/distance*travel,0,walls);moveWithCollision(e,0,dy/distance*travel,walls);}
      }
      e.x=Math.max(0,Math.min(level.width-e.width,e.x));e.y=Math.max(0,Math.min(level.height-e.height,e.y));
    }
    // Hiding keeps the player safe while holding H, even if a pursuer reaches the refuge.
    if(!state.hiding&&state.grace===0&&isColliding(player,e)){state.defeated=true;state.reason="Caught! R to retry, Esc for home.";return;}
  }
  if(state.remaining===0){state.defeated=true;state.reason="Time expired. R to retry, Esc for home.";}
}
function drawPursuit(ctx,level,state,player){
  ctx.save();ctx.textAlign="left";ctx.textBaseline="top";ctx.font="14px monospace";
  for(const z of level.pursuit.hidingSpots){ctx.fillStyle="rgba(52,211,153,0.2)";ctx.fillRect(z.x,z.y,z.width,z.height);ctx.strokeStyle="#34d399";ctx.strokeRect(z.x,z.y,z.width,z.height);ctx.fillStyle="white";ctx.fillText("Hold H: hide",z.x,z.y-20);}
  for(const e of state.enemies){ctx.fillStyle=e.stunned>0?"#a78bfa":e.target?"#fb7185":"#f59e0b";ctx.fillRect(e.x,e.y,e.width,e.height);ctx.fillStyle="white";ctx.fillText(e.stunned>0?"Stunned":e.target?"Chasing":"Watching",e.x,e.y-20);}
  if(state.flash>0){ctx.strokeStyle="#fef08a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x+player.width/2,player.y+player.height/2,level.pursuit.stunRadius,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle="#101827";ctx.fillRect(360,12,590,76);ctx.fillStyle="white";
  ctx.fillText("Escape: "+Math.ceil(state.remaining)+"s | Flash: "+(state.cooldown>0?Math.ceil(state.cooldown)+"s":"READY"),370,20);
  ctx.fillText("Q: stun nearby threat | Hold H inside green refuge",370,43);
  ctx.fillText(state.defeated?state.reason:state.hiding?"Hidden. The escape clock keeps running!":"Collect the key, avoid pursuit, reach the gold exit.",370,65);ctx.restore();
}

</script>
<script>
// TEACHER-OWNED: a one-player shooting challenge, not a full team-sports simulator.
// Students customize the hoop and challenge settings in pack.js.
function createSkillChallenge(level) {
  return {
    angle: level.challenge.startAngle, power: level.challenge.startPower,
    score: 0, shots: 0, remaining: level.challenge.timeLimit,
    started: false, won: false, expired: false, ball: null,
    message: "Set your angle and power, then tap Space."
  };
}

function sportsBackboard(level) {
  // The board is derived from the hoop, so students only move one target rectangle.
  return {x:level.goal.x+level.goal.width+14,y:level.goal.y-80,width:12,height:100};
}

function launchSportsBall(level, state) {
  const radians = state.angle * Math.PI / 180;
  state.ball = {x:level.spawn.x,y:level.spawn.y,
    vx:Math.cos(radians)*state.power,vy:-Math.sin(radians)*state.power};
  state.started = true;state.shots += 1;state.message = "Shot in flight...";
}

function updateSkillChallenge(level, state, seconds, controls) {
  if (state.won || state.expired) return;
  const config = level.challenge;
  if (!state.ball) {
    // One key press makes one adjustment. Settings stay fixed while a ball is flying.
    state.angle = Math.max(20,Math.min(80,state.angle + (controls.up ? 1 : 0) - (controls.down ? 1 : 0)));
    state.power = Math.max(300,Math.min(900,state.power + (controls.right ? 10 : 0) - (controls.left ? 10 : 0)));
    if (controls.shoot) launchSportsBall(level,state);
  }
  if (!state.started) return; // No time pressure while the player reads the instructions.
  // Small physics steps prevent a fast ball skipping the rim or backboard.
  // Exact constant-gravity integration keeps identical shots consistent across frame rates.
  let time = Math.min(Math.max(0,seconds),state.remaining);
  while (time > 0 && !state.won && !state.expired) {
    const dt = Math.min(time,1/120);
    state.remaining = Math.max(0,state.remaining-dt);time -= dt;
    if (state.ball) stepSportsBall(level,state,dt);
    // A basket at the buzzer counts: process its crossing before declaring time out.
    if (state.remaining <= 1e-9 && !state.won) {
      state.remaining = 0;state.expired = true;state.ball = null;
      state.message = "Time is up. Press R to try again.";
    }
  }
}

function stepSportsBall(level, state, dt) {
  const ball = state.ball, config = level.challenge, goal = level.goal;
  const radius = config.ballRadius, oldX = ball.x, oldY = ball.y;
  ball.x += ball.vx*dt;
  ball.y += ball.vy*dt + 0.5*config.gravity*dt*dt;
  ball.vy += config.gravity*dt;
  // A basket must cross the rim from ABOVE while descending; touching from below misses.
  if (oldY < goal.y && ball.y >= goal.y && ball.vy > 0) {
    const fraction = (goal.y-oldY)/(ball.y-oldY);
    const crossingX = oldX + (ball.x-oldX)*fraction;
    if (crossingX >= goal.x+radius && crossingX <= goal.x+goal.width-radius) {
      state.score += 1;state.ball = null;
      state.won = state.score >= config.targetScore;
      state.message = state.won ? "Target reached! Press Enter to finish." : "Basket! Set up your next shot.";
      return; // Removing the ball prevents a single shot from scoring twice.
    }
  }
  const board = sportsBackboard(level);
  if (ball.y+radius > board.y && ball.y-radius < board.y+board.height) {
    if (ball.vx > 0 && oldX+radius <= board.x && ball.x+radius >= board.x) {
      ball.x = board.x-radius;ball.vx *= -0.6;
    } else if (ball.vx < 0 && oldX-radius >= board.x+board.width && ball.x-radius <= board.x+board.width) {
      ball.x = board.x+board.width+radius;ball.vx *= -0.6;
    }
  }
  if (ball.y+radius >= config.floorY || ball.x+radius < 0 || ball.x-radius > level.width) {
    state.ball = null;state.message = "Miss. Adjust angle or power and try again.";
  }
}

function drawSkillChallenge(ctx, level, state) {
  const config = level.challenge, goal = level.goal, board = sportsBackboard(level);
  ctx.save();ctx.fillStyle = "#142139";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#986746";ctx.fillRect(0,config.floorY,level.width,level.height-config.floorY);
  // Hoop and net: only a downward crossing inside the rim scores.
  ctx.fillStyle = "#e2e8f0";ctx.fillRect(board.x,board.y,board.width,board.height);
  ctx.strokeStyle = "#e2e8f0";ctx.lineWidth = 2;
  ctx.beginPath();ctx.moveTo(goal.x,goal.y);ctx.lineTo(goal.x+18,goal.y+42);
  ctx.lineTo(goal.x+goal.width-18,goal.y+42);ctx.lineTo(goal.x+goal.width,goal.y);ctx.stroke();

<script>
// TEACHER-OWNED: a small 3-on-3 prototype. Debra edits the roster in her pack.js.
// The player's timing and roster stats both matter; no grade or real-person ability is inferred.
function createBasketball(level) {
  const players = [];
  level.basketball.teams.forEach((team,t) => team.players.forEach((p,i) => {
    players.push(Object.assign({},p,{team:t,index:i,x:t===0?(i===0?240:360):(i===0?720:600),y:i===0?350:i===1?235:465}));
  }));
  return {players,hero:players[0].id,owner:players[1].id,flight:null,meter:null,
    possessionTeam:0,possessionRemaining:14,buzzer:false,
    score:[0,0],remaining:level.basketball.seconds,age:0,actionAge:0,
    won:false,finished:false,roster:false,randomSeed:level.basketball.seed,
    message:"Teammates look for you. E calls for a pass; 1/2 passes to them.",lastShot:null};
}
function basketballPlayer(state,id) {return state.players.find(p=>p.id===id);}
function basketballRandom(state) {
  // A seeded generator makes classroom bugs reproducible after R restarts a match.
  state.randomSeed=(Math.imul(1664525,state.randomSeed)+1013904223)>>>0;
  return state.randomSeed/4294967296;
}
function basketballDistance(a,b) {return Math.hypot(a.x-b.x,a.y-b.y);}
function basketballHoop(team) {return {x:team===0?870:90,y:350};}
function basketballPressure(state,player) {
  return Math.min(1,state.players.filter(p=>p.team!==player.team).reduce((sum,p)=>{
    return sum+Math.max(0,1-basketballDistance(player,p)/95)*(0.4+p.defense/100*0.6);
  },0));
}
function basketballTimingWindow(player) {return 0.07+player.shooting*0.0013;}
function basketballNeedle(level,meter) {return Math.sin(meter.elapsed*Math.PI*2*level.basketball.meterCycles-Math.PI/2);}
function basketballShotChance(state,player,error) {
  const quality=Math.max(0,1-error/(basketballTimingWindow(player)*2));
  const distance=basketballDistance(player,basketballHoop(player.team));
  // Timing matters, but range matters too: full-court heaves should not beat working for a close shot.
  // Higher shooting stats improve the base chance AND make good timing more forgiving.
  return Math.max(0.03,Math.min(0.98,0.12+player.shooting/100*0.4+quality*0.45
    -Math.max(0,distance-150)/450-basketballPressure(state,player)*0.24));
}
function basketballGiveBall(state,id) {
  const player=basketballPlayer(state,id);
  // Passes do not reset the clock. A change of team starts a new 14-second possession.
  if(player&&player.team!==state.possessionTeam){state.possessionTeam=player.team;state.possessionRemaining=14;}
  state.owner=id;state.flight=null;state.meter=null;state.actionAge=0;

function basketballResetPositions(state) {
  state.players.forEach(p=>{p.x=p.team===0?(p.index===0?240:360):(p.index===0?720:600);p.y=p.index===0?350:p.index===1?235:465;});

function basketballPass(state,from,to) {
  if (!from || !to || from.team!==to.team || from.id===to.id) return;
  const distance=basketballDistance(from,to);
  // Defenders near the passing lane can intercept. Passing stats reduce that risk.
  const dx=to.x-from.x,dy=to.y-from.y,length2=dx*dx+dy*dy;

    const t=length2?Math.max(0,Math.min(1,((p.x-from.x)*dx+(p.y-from.y)*dy)/length2)):0;
    const d=Math.hypot(p.x-(from.x+t*dx),p.y-(from.y+t*dy));

  const target=defender&&basketballRandom(state)<risk?defender:to;

    elapsed:0,duration:Math.max(0.18,distance/(380+from.passing*3)),intercepted:target!==to};
  state.owner=null;state.meter=null;state.message=from.name+" passes to "+to.name+".";

function basketballShoot(level,state,player,error) {

    team:player.team,points,made:state.lastShot.made};

  if(state.possessionRemaining===0&&!state.buzzer){
    const next=state.players.find(p=>p.team!==state.possessionTeam&&p.index===0);
    basketballResetPositions(state);basketballGiveBall(state,next.id);

    }else if(state.owner===p.id&&p.team===1){basketballMove(p,210,350,seconds);}

    }else{
      const mark=state.players.find(q=>q.team!==p.team&&q.index===p.index);

      const outlet=state.players.filter(p=>p.team===1&&p.id!==current.id)
        .sort((a,b)=>basketballPressure(state,a)-basketballPressure(state,b))[0];
      if(basketballPressure(state,outlet)+0.15<basketballPressure(state,current))basketballPass(state,current,outlet);
      else if(state.actionAge>1.2&&basketballDistance(current,basketballHoop(1))<190)
        basketballShoot(level,state,current,basketballRandom(state)*0.18);
    } else if(current.team===1&&state.actionAge>1.2&&basketballDistance(current,basketballHoop(1))<190){

      basketballShoot(level,state,current,basketballRandom(state)*0.18);

    if(state.owner&&state.actionAge>0.8){

        state.score[f.team]+=f.points;basketballResetPositions(state);
        basketballGiveBall(state,state.players.find(p=>p.team!==f.team&&p.index===0).id);
        state.message=f.points+" points! Other team takes possession.";

        const rebound=state.players.slice().sort((a,b)=>basketballDistance(a,f.to)-basketballDistance(b,f.to))[0];
        basketballGiveBall(state,rebound.id);state.message="Miss. "+rebound.name+" gets the rebound.";
      }
    }
  }
  // Separate overlapping player circles to keep possession and defense readable.
  for(let i=0;i<state.players.length;i++)for(let j=i+1;j<state.players.length;j++){
    const a=state.players[i],b=state.players[j],d=basketballDistance(a,b);

      a.x+=nx*shift;a.y+=ny*shift;b.x-=nx*shift;b.y-=ny*shift;}
  }
  state.players.forEach(p=>{p.x=Math.max(58,Math.min(902,p.x));p.y=Math.max(148,Math.min(552,p.y));});
  if(state.score.some(s=>s>=level.basketball.targetScore)||(state.buzzer&&!state.flight)){
    state.finished=true;state.won=state.score[0]>state.score[1];state.meter=null;state.flight=null;
    state.message=state.won?"You win! Enter saves the result and returns home.":state.score[0]===state.score[1]?"Tie game. R to retry, Esc for home.":"Match over. R to retry, Esc for home.";
  }
}

<script>
// SIMONE'S SOCCER STARTER: top-down dribbling and a timed shooting challenge.
// Students edit level.soccer. This first version is one attacker versus one goalkeeper.
function createSoccer(level){
 const c=level.soccer,g=level.goal;
 return {player:{x:level.spawn.x,y:level.spawn.y},keeper:{x:g.x-46,y:g.y+g.height/2-c.keeperHeight/2,width:18,height:c.keeperHeight,direction:1},
   angle:0,power:c.startPower,ball:null,recovery:0,score:0,shots:0,saves:0,remaining:c.seconds,started:false,won:false,expired:false,
   message:"Move into position. The clock starts with your first kick."};
}
function soccerKick(level,state){
 const radians=state.angle*Math.PI/180;
 state.ball={x:state.player.x+20,y:state.player.y,vx:Math.cos(radians)*state.power,vy:Math.sin(radians)*state.power};
 state.shots++;state.started=true;state.message="Kick in flight. Aim away from the keeper!";
}
function soccerEndShot(state,message){state.ball=null;state.recovery=0.65;state.message=message;}
function stepSoccer(level,state,dt){
 const c=level.soccer,g=level.goal,k=state.keeper;
 // The keeper patrols before a shot, then tracks its current Y position at a limited speed.
 // It cannot teleport or know the shot's future path. Try aiming for the opposite corner.
 if(state.ball){const target=state.ball.y-k.height/2;k.y+=Math.sign(target-k.y)*Math.min(Math.abs(target-k.y),c.keeperSpeed*dt);}
 else k.y+=k.direction*c.keeperSpeed*0.7*dt;
 if(k.y<=g.y){k.y=g.y;k.direction=1;}if(k.y+k.height>=g.y+g.height){k.y=g.y+g.height-k.height;k.direction=-1;}
 if(!state.ball)return;

 const movingTime=Math.min(dt,speed/c.drag),distance=speed*movingTime-0.5*c.drag*movingTime*movingTime;
 const dx=speed?b.vx/speed*distance:0,dy=speed?b.vy/speed*distance:0;
 // Reuse the shared swept rectangle check: fast kicks cannot jump through the keeper.
 if(shooterHitTime(oldX,oldY,dx,dy,k,r)!==null){state.saves++;soccerEndShot(state,"Saved! Move or aim toward an open corner.");return;}
 b.x+=dx;b.y+=dy;const nextSpeed=Math.max(0,speed-c.drag*dt);

   soccerEndShot(state,state.won?"Target reached! Enter saves your win.":"GOAL! Find space for your next shot.");
  }else soccerEndShot(state,"Wide of the posts. Adjust your aim.");
  return;
 }
 if(b.y-r<140||b.y+r>590||b.x<40||nextSpeed<35)soccerEndShot(state,"Out or stopped. Try a closer or stronger kick.");
}
function updateSoccer(level,state,seconds,controls){
 if(state.won||state.expired)return;

 // Movement and aiming are independent; diagonal walking is normalized.
 const x=(controls.right?1:0)-(controls.left?1:0),y=(controls.down?1:0)-(controls.up?1:0),length=Math.hypot(x,y);
 if(length){state.player.x+=x/length*c.playerSpeed*seconds;state.player.y+=y/length*c.playerSpeed*seconds;}

 if(controls.kick&&!state.ball&&state.recovery===0)soccerKick(level,state);
