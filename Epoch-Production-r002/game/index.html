<script>
// JACENTO'S FOOTBALL: a ball-carrying drill, with independent state for each attempt.
// Students tune level.football in their pack. Positions are centers; speeds are pixels/second.
function createFootball(level){
 const c=level.football;
 const state={touchdowns:0,attempt:1,remaining:c.seconds,phase:"ready",won:false,expired:false};
 footballResetPlay(level,state);return state;
}
function footballResetPlay(level,state){
 // Copy design data so retry and replay never change the student's saved pack.
 state.player={x:level.spawn.x,y:level.spawn.y};state.stamina=level.football.sprintSeconds;
 state.defenders=level.football.defenders.map(d=>({x:d.x,y:d.y,homeX:d.x,direction:d.direction||1}));
 state.message="Enter starts the play. Carry the ball into the right end zone.";
}
function footballCircleHits(p,r,box){
 const x=Math.max(box.x,Math.min(p.x,box.x+box.width)),y=Math.max(box.y,Math.min(p.y,box.y+box.height));
 return Math.hypot(p.x-x,p.y-y)<r;
}
function footballMove(level,p,dx,dy,r){
 // Move one axis at a time: hitting a training barrier lets you slide along its edge.
 // Small simulation steps prevent fast players or defenders from skipping through barriers.
 const oldX=p.x;p.x=Math.max(60+r,Math.min(900-r,p.x+dx));
 if(level.solids.some(b=>footballCircleHits(p,r,b)))p.x=oldX;
 const oldY=p.y;p.y=Math.max(150+r,Math.min(580-r,p.y+dy));
 if(level.solids.some(b=>footballCircleHits(p,r,b)))p.y=oldY;
}
function footballFinishPlay(level,state,touchdown){
 if(touchdown)state.touchdowns++;
 state.won=state.touchdowns>=level.football.targetTouchdowns;
 state.phase=state.won?"won":state.attempt>=level.football.attempts?"lost":"between";
 state.message=state.won?"Challenge won! Enter saves your result.":
  state.phase==="lost"?"Attempts used. R retries the whole challenge.":
  touchdown?"TOUCHDOWN! Enter sets up the next play.":"Tackled! Change your route. Enter starts a new play.";
}
function updateFootball(level,state,seconds,controls){
 if(state.won||state.expired||state.phase==="lost")return;
 const c=level.football;
 // Enter explicitly starts each play. Reading the instructions never spends clock time.
 if(state.phase==="ready"||state.phase==="between"){
  if(!controls.start)return;
  if(state.phase==="between"){state.attempt++;footballResetPlay(level,state);}
  state.phase="running";state.message="Find a gap. Hold Space while moving to sprint.";
 }
 let time=Math.min(Math.max(0,seconds),state.remaining);
 while(time>1e-9&&state.phase==="running"){
  const dt=Math.min(time,1/120);time-=dt;state.remaining=Math.max(0,state.remaining-dt);
  const p=state.player,x=(controls.right?1:0)-(controls.left?1:0),y=(controls.down?1:0)-(controls.up?1:0),length=Math.hypot(x,y);
  // Sprint uses an energy budget. Once empty, release Space to recover before sprinting again.
  const sprint=controls.sprint&&length>0&&state.stamina>0;
  const sprintTime=sprint?Math.min(dt,state.stamina):0;
  const distance=c.playerSpeed*dt+(c.sprintSpeed-c.playerSpeed)*sprintTime;
  if(sprint)state.stamina=Math.max(0,state.stamina-dt);
  else if(!controls.sprint)state.stamina=Math.min(c.sprintSeconds,state.stamina+c.recovery*dt);
  if(length)footballMove(level,p,x/length*distance,y/length*distance,14);
  for(const d of state.defenders){
   // Defenders patrol a lane, then pursue nearby runners at a slower speed.
   // They see current position only, never teleport, and obey the same barriers.
   const dx=p.x-d.x,dy=p.y-d.y,range=Math.hypot(dx,dy);
   if(range<c.noticeRadius&&range>0)footballMove(level,d,dx/range*c.defenderSpeed*dt,dy/range*c.defenderSpeed*dt,14);
   else{
    footballMove(level,d,Math.sign(d.homeX-d.x)*Math.min(Math.abs(d.homeX-d.x),c.defenderSpeed*dt),d.direction*c.defenderSpeed*0.65*dt,14);
    if(d.y<=170)d.direction=1;if(d.y>=560)d.direction=-1;
   }
  }
  // A tackle wins ties with a touchdown. Reach the goal with your entire player circle.
  if(state.defenders.some(d=>Math.hypot(p.x-d.x,p.y-d.y)<=28)){footballFinishPlay(level,state,false);}
  else if(p.x-14>=level.goal.x){footballFinishPlay(level,state,true);}
  // A completed winning run at the buzzer counts; every other unfinished challenge expires.
  if(state.remaining<=1e-9&&!state.won){state.remaining=0;state.expired=true;state.phase="lost";state.message="Time is up. R retries; Escape returns home.";}
 }
}
function drawFootball(ctx,level,state){
 const c=level.football;ctx.save();ctx.fillStyle="#102b28";ctx.fillRect(0,0,960,640);
 ctx.fillStyle="#287347";ctx.fillRect(60,150,840,430);
 ctx.fillStyle="#164e63";ctx.fillRect(level.goal.x,150,900-level.goal.x,430);
 ctx.strokeStyle="#e6f5df";ctx.lineWidth=2;ctx.strokeRect(60,150,840,430);
 ctx.font="14px monospace";ctx.textAlign="center";
 for(let x=140;x<810;x+=84){ctx.beginPath();ctx.moveTo(x,150);ctx.lineTo(x,580);ctx.stroke();ctx.fillStyle="#d9eddb";ctx.fillText(String(Math.round((x-60)/8.4)),x,170);}
 ctx.save();ctx.translate(866,365);ctx.rotate(-Math.PI/2);ctx.font="24px monospace";ctx.fillStyle="white";ctx.fillText("END ZONE",0,0);ctx.restore();
 // Orange striped pads are solid training obstacles, not collectible objects.
 for(const b of level.solids){ctx.fillStyle="#c66a18";ctx.fillRect(b.x,b.y,b.width,b.height);ctx.strokeStyle="#ffe5a0";ctx.strokeRect(b.x,b.y,b.width,b.height);}
 function player(p,color,label){ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle="white";ctx.stroke();ctx.fillStyle="white";ctx.font="12px monospace";ctx.fillText(label,p.x,p.y-22);}
 state.defenders.forEach((d,i)=>player(d,"#e85d75",String(i+1)));
 player(state.player,"#60a5fa","YOU");
 // The football stays in the runner's hands: this drill has no throwing or loose-ball rules.
 ctx.fillStyle="#9a572c";ctx.beginPath();ctx.ellipse(state.player.x+12,state.player.y,9,5,0.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle="white";ctx.beginPath();ctx.moveTo(state.player.x+8,state.player.y);ctx.lineTo(state.player.x+16,state.player.y);ctx.stroke();
 ctx.fillStyle="#101827";ctx.fillRect(0,0,960,132);ctx.fillStyle="white";ctx.textAlign="left";ctx.font="21px monospace";
 ctx.fillText("CENTO'S ISLAND | TD "+state.touchdowns+"/"+c.targetTouchdowns+" | Play "+state.attempt+"/"+c.attempts+" | "+Math.ceil(state.remaining)+"s",22,29);
 ctx.font="14px monospace";ctx.fillText("WASD/arrows: run | Hold Space: sprint | Enter: start/next play | R: retry | Esc: home",22,56);
 ctx.fillText("Sprint",22,81);ctx.fillStyle="#334155";ctx.fillRect(85,69,150,14);ctx.fillStyle="#5eead4";ctx.fillRect(85,69,150*state.stamina/c.sprintSeconds,14);
 ctx.fillStyle="white";ctx.fillText("Score: "+state.touchdowns*6,260,81);ctx.fillText(state.message,22,110);
 ctx.fillText("Avoid red defenders and orange pads. Clock pauses between plays; retry resets everything.",22,615);ctx.restore();
}

<script>
// DORRIES'S RANCH: a timed, top-down calf-catching starter.
// Students edit level.ranch in pack.js. Centers and ranges are pixels; speeds use seconds.
function createRanch(level){
 const c=level.ranch;
 return {player:{x:level.spawn.x,y:level.spawn.y},calves:c.calves.map(calf=>{
   const angle=calf.heading*Math.PI/180;
   return {id:calf.id,x:calf.x,y:calf.y,dx:Math.cos(angle),dy:Math.sin(angle),caught:false};
  }),caught:0,throws:0,cooldown:0,remaining:c.seconds,started:false,won:false,expired:false,
  rope:null,message:"Enter starts. Move close, then tap Space when a calf glows green."};

function ranchNearest(level,state){
 // A single tap targets only the nearest uncaught calf whose CENTER is in the circle.
 // Ties follow pack order, so the same input always has the same result.
 let nearest=null,distance=level.ranch.catchRange;
 for(const calf of state.calves){
  const d=Math.hypot(calf.x-state.player.x,calf.y-state.player.y);
  if(!calf.caught&&d<=distance&&(!nearest||d<distance)){nearest=calf;distance=d;}
 }
 return nearest;
}
function ranchCatch(level,state){
 if(!state.started||state.won||state.expired||state.remaining<=0||state.cooldown>0)return;

 state.rope={x:calf?calf.x:state.player.x+level.ranch.catchRange,y:calf?calf.y:state.player.y,remaining:0.22,success:!!calf};
 if(!calf){state.message="Miss! Get a calf's center inside the circle, then tap Space again.";return;}
 calf.caught=true;state.caught++;state.won=state.caught>=level.ranch.targetCatches;
 state.message=state.won?"Calves safe! Enter saves your win.":"Caught! Find the next calf. Release Space before throwing again.";
}
function updateRanch(level,state,seconds,controls){
 if(state.won||state.expired)return;
 if(!state.started){if(!controls.start)return;state.started=true;state.message="Green calf = in range. Tap Space to catch; holding it does not repeat.";}
 // Resolve the fresh press at the current position, before simulating the next time slice.
 // A catch while time remains counts; once the clock reaches zero the round is frozen.
 if(controls.catch)ranchCatch(level,state);
 let time=Math.min(Math.max(0,seconds),state.remaining);const c=level.ranch;
 while(time>1e-9&&!state.won){
  const dt=Math.min(time,1/120);time-=dt;state.remaining=Math.max(0,state.remaining-dt);
  state.cooldown=Math.max(0,state.cooldown-dt);
  if(state.rope){state.rope.remaining-=dt;if(state.rope.remaining<=0)state.rope=null;}
  // Normalize diagonal movement so it is no faster than walking straight.
  const x=(controls.right?1:0)-(controls.left?1:0),y=(controls.down?1:0)-(controls.up?1:0),length=Math.hypot(x,y),p=state.player;
  if(length){p.x+=x/length*c.playerSpeed*dt;p.y+=y/length*c.playerSpeed*dt;}
  p.x=Math.max(74,Math.min(886,p.x));p.y=Math.max(164,Math.min(566,p.y));
  for(const calf of state.calves){
   if(calf.caught)continue;

   // The player stays faster: anticipating a route helps, but a novice can still catch up.
   const dx=calf.x-p.x,dy=calf.y-p.y,d=Math.hypot(dx,dy);
   if(d>1e-6&&d<c.fleeRadius){calf.dx=dx/d;calf.dy=dy/d;}
   calf.x+=calf.dx*c.calfSpeed*dt;calf.y+=calf.dy*c.calfSpeed*dt;
   if(calf.x<74){calf.x=74;calf.dx=Math.abs(calf.dx);}if(calf.x>886){calf.x=886;calf.dx=-Math.abs(calf.dx);}
   if(calf.y<164){calf.y=164;calf.dy=Math.abs(calf.dy);}if(calf.y>566){calf.y=566;calf.dy=-Math.abs(calf.dy);}
  }

 ctx.fillStyle="#dec596";for(let x=60;x<=900;x+=60){ctx.fillRect(x-4,144,8,16);ctx.fillRect(x-4,572,8,16);}
 // The header pen is a score display, outside the playable pasture.
 ctx.fillStyle="#101827";ctx.fillRect(0,0,960,130);ctx.fillStyle="#a84f42";ctx.fillRect(764,48,168,70);ctx.fillStyle="#e1b886";ctx.beginPath();ctx.moveTo(752,48);ctx.lineTo(848,16);ctx.lineTo(944,48);ctx.fill();
 ctx.fillStyle="#e8dfc7";ctx.font="12px monospace";ctx.textAlign="center";ctx.fillText("SAFE PEN",848,65);

  ctx.fillStyle="#efe3cb";ctx.beginPath();ctx.ellipse(x,y,15,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#80543a";ctx.fillRect(x-6,y-7,8,10);

 ctx.strokeStyle=target&&state.cooldown===0?"#b6ff9a":"#f3d48b";ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(p.x,p.y,c.catchRange,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle="#75b7ec";ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();ctx.fillStyle="#c79753";ctx.beginPath();ctx.ellipse(p.x,p.y-4,20,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#8c602f";ctx.fillRect(p.x-8,p.y-12,16,9);

<script>
// TEACHER-OWNED: Main Plaza tilemap. Home icons are placed by homeRegistry, not this file.
const TILE_SIZE = 32;

const TILE_COLORS = {
  0: null,
  1: "#4caf50",
  2: "#d2b48c",
  3: "#3a83c4",
  4: "#1b5e20",
  5: "#8d5524",
  6: "#777777"
};

// Collision tiles: water, trees, buildings, and walls block movement.
const COLLISION_TILE_IDS = [3, 4, 5, 6];

function createEmptyLayer(width, height, fillValue) {
  const layer = [];
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      layer.push(fillValue);
    }
  }
  return layer;
}

function setTile(layer, width, x, y, value) {
  layer[y * width + x] = value;
}

function fillRect(layer, width, x, y, w, h, value) {
  for (let row = y; row < y + h; row++) {
    for (let col = x; col < x + w; col++) {
      setTile(layer, width, col, row, value);
    }
  }
}

function buildMainPlazaLayers(width, height) {
  const ground = createEmptyLayer(width, height, 1);
  const collision = createEmptyLayer(width, height, 0);

  // Border trees around the plaza.
  for (let x = 0; x < width; x++) {
    setTile(ground, width, x, 0, 4);
    setTile(collision, width, x, 0, 4);
    setTile(ground, width, x, height - 1, 4);
    setTile(collision, width, x, height - 1, 4);
  }
  for (let y = 0; y < height; y++) {
    setTile(ground, width, 0, y, 4);
    setTile(collision, width, 0, y, 4);
    setTile(ground, width, width - 1, y, 4);
    setTile(collision, width, width - 1, y, 4);
  }

  // Water corners for visual framing.
  fillRect(ground, width, 1, 1, 3, 2, 3);
  fillRect(collision, width, 1, 1, 3, 2, 3);
  fillRect(ground, width, width - 4, 1, 3, 2, 3);
  fillRect(collision, width, width - 4, 1, 3, 2, 3);

  // Main cross paths through the plaza.
  fillRect(ground, width, 8, 4, 24, 3, 2);
  fillRect(ground, width, 18, 6, 4, 18, 2);

  // District gate placeholder on the right edge (wall tiles).
  fillRect(ground, width, width - 3, 12, 2, 4, 6);
  fillRect(collision, width, width - 3, 12, 2, 4, 6);

  // Hub sign area near spawn.
  fillRect(ground, width, 14, 10, 2, 2, 6);
  fillRect(collision, width, 14, 10, 2, 2, 6);

  // Building footprints only. Home icons and lock state come from pack.js / plotHomes.
  const homePlots = [
    { x: 10, y: 8, w: 2, h: 2 },
    { x: 24, y: 8, w: 2, h: 2 },
    { x: 10, y: 20, w: 2, h: 2 },
    { x: 24, y: 20, w: 2, h: 2 },
    { x: 17, y: 14, w: 2, h: 2 }
  ];

  for (let i = 0; i < homePlots.length; i++) {
    const plot = homePlots[i];
    fillRect(ground, width, plot.x, plot.y, plot.w, plot.h, 5);
    fillRect(collision, width, plot.x, plot.y, plot.w, plot.h, 5);
  }

  return { ground: ground, collision: collision };
}

const MAP_WIDTH = 40;
const MAP_HEIGHT = 30;
const mainPlazaLayers = buildMainPlazaLayers(MAP_WIDTH, MAP_HEIGHT);

const overworldMap = {
  tileSize: TILE_SIZE,
  width: MAP_WIDTH,
  height: MAP_HEIGHT,
  layers: mainPlazaLayers,
  spawn: {
    x: 18 * TILE_SIZE + 8,
    y: 14 * TILE_SIZE + 8
  },
  signPosition: {
    x: 14 * TILE_SIZE,
    y: 10 * TILE_SIZE,
    width: 64,
    height: 64
  }
};

function getTileColor(tileId) {
  return TILE_COLORS[tileId] || "#222222";
}

function buildCollisionFromMap(map) {
  const solids = [];
  const layer = map.layers.collision;
  const tileSize = map.tileSize;

  for (let y = 0; y < map.height; y++) {
    for (let x = 0; x < map.width; x++) {
      const tileId = layer[y * map.width + x];
      if (COLLISION_TILE_IDS.includes(tileId)) {
        solids.push({
          x: x * tileSize,
          y: y * tileSize,
          width: tileSize,
          height: tileSize
        });
      }
    }
  }

  return solids;
}

function drawTilemapLayer(ctx, map, camera) {
  const camX = camera ? camera.x : 0;
  const camY = camera ? camera.y : 0;
  const layer = map.layers.ground;
  const tileSize = map.tileSize;

  for (let y = 0; y < map.height; y++) {
    for (let x = 0; x < map.width; x++) {
      const tileId = layer[y * map.width + x];
      const color = getTileColor(tileId);
      if (!color) {
        continue;
      }

      ctx.fillStyle = color;
      ctx.fillRect(
        x * tileSize - camX,
        y * tileSize - camY,
        tileSize,
        tileSize
      );
    }
  }
}

<script>
// TEACHER-OWNED: student packs call registerStudentPack() from js/students/<id>/pack.js
// A pack with errors is quarantined instead of loaded, so one broken world cannot take down the class.
const studentManifests = [];
const studentPackReports = [];

function fillManifestDefaults(manifest) {
  if (!manifest.name) {
    manifest.name = manifest.id;
  }
  if (!manifest.author) {
    manifest.author = "Unknown";
  }
  if (!manifest.iconColor) {
    manifest.iconColor = "blue";
  }
  if (!(manifest.width > 0)) {
    manifest.width = 32;
  }
  if (!(manifest.height > 0)) {
    manifest.height = 32;
  }
  manifest.locked = !!manifest.locked;
}

// Pack-local levels get an id derived from the pack so two students can never collide.
function fillLevelDefaults(pack) {
  const manifest = pack.manifest;

  if (pack.level) {
    if (!pack.level.id) {
      pack.level.id = manifest.id + "_level";
    }
    if (!pack.level.mode) {
      pack.level.mode = "platformer";
    }
    if (!Array.isArray(pack.level.hazards)) {
      pack.level.hazards = [];
    }
    // New packs use levelId; older packs may keep platformerLevelId.
    // Preserve the old alias for Overworld registries and external classroom tools.
    manifest.levelId = manifest.levelId || manifest.platformerLevelId || pack.level.id;
    manifest.platformerLevelId = manifest.levelId;
  }

  if (manifest.platformerLevelId && !manifest.rewardId) {
    manifest.rewardId = "key_" + manifest.id;
  }
  if (pack.level && !pack.level.rewardId) {
    pack.level.rewardId = manifest.rewardId;
  }
}

function logPackReport(report) {
  if (report.status === "rejected") {
    console.error(
      "Student pack '" + report.id + "' was NOT loaded:\n  - " + report.errors.join("\n  - ")
    );
    return;
  }
  if (report.warnings.length > 0) {
    console.warn(
      "Student pack '" + report.id + "' loaded with warnings:\n  - " + report.warnings.join("\n  - ")
    );
  }
}

function registerStudentPack(pack) {
  let report;

  try {
    report = validatePack(pack);
  } catch (err) {
    report = {
      id: pack && pack.manifest ? pack.manifest.id : "(unknown)",
      status: "rejected",
      errors: ["pack could not be read: " + err.message],
      warnings: []
    };
  }

  if (report.status !== "rejected") {
    const duplicate = studentManifests.some(function (existing) {
      return existing.manifest.id === pack.manifest.id;
    });
    if (duplicate) {
      report.status = "rejected";
      report.errors.push("manifest.id '" + pack.manifest.id + "' is already registered by another pack");
    }
  }

  if (report.status === "rejected") {
    studentPackReports.push(report);
    logPackReport(report);
    return false;
  }

  try {
    fillManifestDefaults(pack.manifest);
    fillLevelDefaults(pack);
  } catch (err) {
    report.status = "rejected";
    report.errors.push("pack defaults could not be applied: " + err.message);
    studentPackReports.push(report);
    logPackReport(report);
    return false;
  }

  studentManifests.push(pack);
  studentPackReports.push(report);
  logPackReport(report);
  return true;
}

function getStudentPack(packId) {
  for (let i = 0; i < studentManifests.length; i++) {
    if (studentManifests[i].manifest.id === packId) {
      return studentManifests[i];
    }
  }
  return null;
}

// Cross-pack problems (duplicate ids, overlapping icons) are folded into the reports at boot.
function runPackRegistryChecks() {
  const problems = validatePackRegistry(studentManifests);

  for (let i = 0; i < problems.length; i++) {
    const problem = problems[i];
    let report = null;
    for (let r = 0; r < studentPackReports.length; r++) {
      if (studentPackReports[r].id === problem.id) {
        report = studentPackReports[r];
        break;
      }
    }
    if (report) {
      report.warnings.push(problem.message);
    }
    console.warn("Pack registry: " + problem.id + " — " + problem.message);
  }

  return problems;
}

function getPackReportSummary() {
  let rejected = 0;
  let warned = 0;

  for (let i = 0; i < studentPackReports.length; i++) {
    if (studentPackReports[i].status === "rejected") {
      rejected += 1;
    } else if (studentPackReports[i].warnings.length > 0) {
      warned += 1;
    }
  }

  return {
    total: studentPackReports.length,
    loaded: studentManifests.length,
    rejected: rejected,
    warned: warned
  };
}

<script>
// TEACHER-OWNED: player movement (top-down on the hub/home, side-view in platformers).
class Player {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.width = 28;
    this.height = 28;
    this.speed = 2.5;
    this.facing = "down";
    this.state = "idle";
    this.vx = 0;
    this.vy = 0;
    this.onGround = false;
    this.jumpCount = 0;
  }

  updatePlatformer(level) {
    const moveSpeed = 4;
    const jumpForce = -11;
    const gravity = 0.55;
    const maxFall = 14;
    const solids = level.solids || [];
    const hazards = level.hazards || [];

    this.vx = 0;
    if (isMoveLeft()) {
      this.vx = -moveSpeed;
      this.facing = "left";
    } else if (isMoveRight()) {
      this.vx = moveSpeed;
      this.facing = "right";
    }

    this.onGround = isOnGround(this, solids);
    const canDoubleJump = typeof hasReward === "function" && hasReward("double_jump");

    if (input.isPressed("Space") || input.isPressed("ArrowUp") || input.isPressed("KeyW")) {
      if (this.onGround) {
        this.vy = jumpForce;
        this.jumpCount = 1;
      } else if (canDoubleJump && this.jumpCount < 2) {
        this.vy = jumpForce;
        this.jumpCount = 2;
      }
    }

    applyGravity(this, gravity, maxFall);
    moveWithCollision(this, this.vx, 0, solids);
    moveWithCollision(this, 0, this.vy, solids);
    this.onGround = isOnGround(this, solids);
    if (this.onGround && this.vy > 0) {
      this.vy = 0;
    }

    for (let i = 0; i < hazards.length; i++) {
      if (isColliding(this, hazards[i])) {
        // Tell the scene to reset the WHOLE attempt, including collected keys.
        return true;
      }
    }

    this.state = this.vx !== 0 || this.vy !== 0 ? "walk" : "idle";
    // Falling out of a level is a failure, not an endless fall.
    return this.y > (level.height || 640) || this.x + this.width < 0 || this.x > (level.width || 960);
  }

  updateTopDown(collisionObjects, movementBlocked) {
    if (movementBlocked) {
      this.state = "idle";
      return;
    }

    let dx = 0;
    let dy = 0;

    // Vertical input wins so the player cannot move diagonally in Version 1.
    if (isMoveUp()) {
      dy = -this.speed;
      this.facing = "up";
    } else if (isMoveDown()) {
      dy = this.speed;
      this.facing = "down";
    } else if (isMoveLeft()) {
      dx = -this.speed;
      this.facing = "left";
    } else if (isMoveRight()) {
      dx = this.speed;
      this.facing = "right";
    }

    if (dx !== 0 || dy !== 0) {
      this.state = "walk";
      moveWithCollision(this, dx, dy, collisionObjects);
    } else {
      this.state = "idle";
    }
  }

  draw(ctx, camera) {
    const camX = camera ? camera.x : 0;
    const camY = camera ? camera.y : 0;
    const screenX = this.x - camX;
    const screenY = this.y - camY;

    ctx.fillStyle = "#3a7bd5";
    ctx.fillRect(screenX, screenY, this.width, this.height);

    ctx.fillStyle = "#cce5ff";
    const indicatorSize = 8;
    let indicatorX = screenX + (this.width - indicatorSize) / 2;
    let indicatorY = screenY + (this.height - indicatorSize) / 2;

    if (this.facing === "up") {
      indicatorY = screenY;
    } else if (this.facing === "down") {
      indicatorY = screenY + this.height - indicatorSize;
    } else if (this.facing === "left") {
      indicatorX = screenX;
    } else if (this.facing === "right") {
      indicatorX = screenX + this.width - indicatorSize;
    }

    ctx.fillRect(indicatorX, indicatorY, indicatorSize, indicatorSize);
  }
}

<script>
// TEACHER-OWNED: objects the player can press E on (homes, NPCs, portals, etc.).
const INTERACTABLE_TYPES = {
  HOME_ENTRANCE: "homeEntrance",
  SIGN: "sign",
  NPC: "npc",
  PORTAL: "portal",
  EXIT: "exit",
  SAVE_POINT: "savePoint",
  SUBMIT_POINT: "submitPoint",
  COLORED_DOOR: "coloredDoor"
};

function getInteractionBox(player) {
  return {
    x: player.x - 4,
    y: player.y - 4,
    width: player.width + 8,
    height: player.height + 8
  };
}

function findClosestInteractable(player, interactables) {
  const box = getInteractionBox(player);
  let closest = null;
  let closestDistance = Infinity;

  for (let i = 0; i < interactables.length; i++) {
    const item = interactables[i];
    if (isColliding(box, item)) {
      const centerX = item.x + item.width / 2;
      const centerY = item.y + item.height / 2;
      const playerCenterX = player.x + player.width / 2;
      const playerCenterY = player.y + player.height / 2;
      const distance =
        Math.abs(centerX - playerCenterX) + Math.abs(centerY - playerCenterY);

      if (distance < closestDistance) {
        closestDistance = distance;
        closest = item;
      }
    }
  }

  return closest;
}

<script>
// TEACHER-OWNED: only one scene is active at a time (title, overworld, home, platformer).
// A scene that throws is quarantined instead of freezing the game for everyone else.
const sceneErrorInfo = {
  sceneName: "",
  message: ""
};

function describeSceneError(err) {
  if (!err) {
    return "Unknown error";
  }
  return err.message ? err.message : String(err);
}

const sceneErrorScene = {
  name: "__sceneError",

  create() {},

  update() {
    if (input.isPressed("Enter") || input.isPressed("Escape")) {
      sceneManager.changeSceneImmediate(sceneManager.fallbackSceneName());
    }
  },

  draw(ctx) {
    ctx.fillStyle = "#0d0d1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#e74c3c";
    ctx.font = "24px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("This world is under construction", canvas.width / 2, 200);

    ctx.fillStyle = "#ffffff";
    ctx.font = "15px monospace";
    ctx.fillText(sceneErrorInfo.sceneName, canvas.width / 2, 250);
    ctx.fillText(sceneErrorInfo.message.slice(0, 70), canvas.width / 2, 290);
    ctx.fillText("Press F3 for the pack report, F12 for the console.", canvas.width / 2, 350);
    ctx.fillText("Press Enter to go back.", canvas.width / 2, 390);
  },

  exit() {}
};

const sceneManager = {
  scenes: {},
  currentScene: null,
  brokenScenes: {},

  register(scene) {
    this.scenes[scene.name] = scene;
  },

  changeScene(sceneName) {
    if (transition.active) {
      return;
    }
    startTransition(sceneName);
  },

  fallbackSceneName() {
    if (!this.brokenScenes.overworld && this.scenes.overworld) {
      return "overworld";
    }
    return "title";
  },

  quarantine(sceneName, err) {
    const message = describeSceneError(err);
    console.error("Scene '" + sceneName + "' was disabled after an error:", err);
    this.brokenScenes[sceneName] = message;
    this.showSceneError(sceneName, message);
  },

  showSceneError(sceneName, message) {
    sceneErrorInfo.sceneName = sceneName;
    sceneErrorInfo.message = message;
    this.currentScene = sceneErrorScene;
    gameState.currentScene = sceneErrorScene.name;
  },

  changeSceneImmediate(sceneName) {
    const nextScene = this.scenes[sceneName];
    if (!nextScene) {
      console.warn("Scene not found:", sceneName);
      return;
    }

    if (this.brokenScenes[sceneName]) {
      this.showSceneError(sceneName, this.brokenScenes[sceneName]);
      return;
    }

    if (this.currentScene && this.currentScene.exit) {
      try {
        this.currentScene.exit();
      } catch (err) {
        console.warn("Scene '" + this.currentScene.name + "' failed to exit cleanly:", err);
      }
    }

    this.currentScene = nextScene;
    gameState.currentScene = sceneName;

    if (nextScene.create) {
      try {
        nextScene.create();
      } catch (err) {
        this.quarantine(sceneName, err);
      }
    }
  },

  update(deltaTime) {
    if (!this.currentScene || !this.currentScene.update) {
      return;
    }
    try {
      this.currentScene.update(deltaTime);
    } catch (err) {
      this.handleActiveSceneError(err);
    }
  },

  draw(ctx) {
    if (!this.currentScene || !this.currentScene.draw) {
      return;
    }
    try {
      this.currentScene.draw(ctx);
    } catch (err) {
      this.handleActiveSceneError(err);
    }
  },

  handleActiveSceneError(err) {
    if (this.currentScene === sceneErrorScene) {
      console.error("Error screen failed:", err);
      return;
    }

      ctx.strokeStyle = "#a78bfa";

      ctx.fillText((door.label || door.id) + (open ? " (open)" : " (locked)"), door.x, door.y - 3);

      this.level.goal.y,

      this.level.goal.height

    this.player.draw(ctx);

    if (this.combat) drawArenaCombat(ctx, this.level, this.combat, this.player);
    if(this.shooter)drawShooter(ctx,this.level,this.shooter,this.player);
    if(this.pursuit)drawPursuit(ctx,this.level,this.pursuit,this.player);
    drawInteractionPrompt(ctx, ((this.combat && this.combat.defeated) || (this.shooter && this.shooter.defeated) || (this.pursuit && this.pursuit.defeated) ? "Defeated" : goalOpen ? "Reach the exit" : this.shooter ? "Clear targets and tasks" : this.combat ? "Clear enemies and tasks" : "Complete tasks") + " | R: restart | Esc: home");

      sceneName: this.name,

      playerY: this.player.y,

      cameraY: 0,

      homeCount: homeRegistry.length

  },

  exit() {
    this.pendingLevelId = null;
    this.pendingRewardId = null;
    this.progress = null;
    this.combat = null;
    this.challenge = null;
    this.basketball = null;
    this.soccer = null;
    this.football = null;
    this.ranch = null;
    this.shooter = null;
    this.pursuit = null;
  }
};

<script>
// TEACHER-OWNED: turns a student pack (js/students/<id>/pack.js) into a playable home.

function clampSpawnTile(value, fallback, max) {
  if (typeof value !== "number" || !isFinite(value)) {
    return fallback;
  }
  return Math.min(Math.max(1, Math.round(value)), max);
}

function buildRoomFromConfig(homeConfig) {
  const config = homeConfig || {};
  const tileSize = config.tileSize > 0 ? config.tileSize : 32;
  const width = Math.max(5, config.width > 0 ? config.width : 20);
  const height = Math.max(5, config.height > 0 ? config.height : 12);
  const ground = [];
  const collision = [];

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const isBorder = x === 0 || y === 0 || x === width - 1 || y === height - 1;
      ground.push(isBorder ? 6 : 2);
      collision.push(isBorder ? 6 : 0);
    }
  }

  const spawnTile = config.spawnTile || {};
  const spawnX = clampSpawnTile(spawnTile.x, Math.floor(width / 2), width - 2);
  const spawnY = clampSpawnTile(spawnTile.y, Math.floor(height / 2), height - 2);

  return {
    tileSize: tileSize,
    width: width,
    height: height,
    pixelWidth: width * tileSize,
    pixelHeight: height * tileSize,
    layers: { ground: ground, collision: collision },
    spawn: {
      x: spawnX * tileSize + 2,
      y: spawnY * tileSize + 2
    }
  };
}

function buildInteractablesFromConfig(homeConfig, manifest) {
  const config = homeConfig || {};
  const tileSize = config.tileSize > 0 ? config.tileSize : 32;
  const source = Array.isArray(config.interactables) ? config.interactables : [];
  const list = [];

  for (let i = 0; i < source.length; i++) {
    const item = source[i];
    if (!item || typeof item.tileX !== "number" || typeof item.tileY !== "number") {
      continue;
    }

    const base = {
      id: item.id || manifest.id + "_item_" + i,
      name: item.name || item.type,
      x: item.tileX * tileSize,
      y: item.tileY * tileSize,
      width: item.width > 0 ? item.width : 32,
      height: item.height > 0 ? item.height : 32
    };

    if (item.type === "npc") {
      list.push({
        type: INTERACTABLE_TYPES.NPC,
        dialogueKey: item.dialogueKey,
        worldId: manifest.id,
        ...base
      });
    } else if (item.type === "portal") {
      list.push({
        type: INTERACTABLE_TYPES.PORTAL,
        levelId: item.levelId || item.platformerLevelId || manifest.levelId || manifest.platformerLevelId,
        rewardId: manifest.rewardId,
        worldId: manifest.id,
        ...base
      });
    } else if (item.type === "exit") {
      list.push({
        type: INTERACTABLE_TYPES.EXIT,
        ...base
      });
    } else if (item.type === "savePoint") {
      list.push({
        type: INTERACTABLE_TYPES.SAVE_POINT,
        worldId: manifest.id,
        ...base
      });
    } else if (item.type === "submitPoint") {
      list.push({
        type: INTERACTABLE_TYPES.SUBMIT_POINT,
        worldId: manifest.id,
        submissionType: item.submissionType || "full",
        ...base
      });
    }
  }

  return list;
}

function createHomeScene(pack) {

    name: sceneName,
    pack: pack,
    room: null,

    create() {

      this.interactables = buildInteractablesFromConfig(pack.home, manifest);
      this.hasExit = this.interactables.some(function (item) {
        return item.type === INTERACTABLE_TYPES.EXIT;
      });
      this.roomOffset.x = (canvas.width - this.room.pixelWidth) / 2;

      if (!this.hasExit && input.isPressed("Escape")) {
        sceneManager.changeScene(typeof window !== "undefined" && window.FVGD_STANDALONE ? "standaloneMenu" : "overworld");
        return;
      }
      this.player.updateTopDown(this.collisionObjects, false);
      this.currentInteractable = findClosestInteractable(this.player, this.interactables);
      if (this.currentInteractable && input.isPressed("KeyE")) {
        this.handleInteract(this.currentInteractable);
      }
      if (this.lastSaveMessage) {
        this._saveMsgTimer = (this._saveMsgTimer || 0) + 1;
        if (this._saveMsgTimer > 120) {
          this.lastSaveMessage = "";
          this._saveMsgTimer = 0;
        }
      }
    },

    draw(ctx) {
      ctx.fillStyle = "#0d0d1a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const ox = this.roomOffset.x;
      const oy = this.roomOffset.y;
      const layer = this.room.layers.ground;
      const tileSize = this.room.tileSize;

      for (let y = 0; y < this.room.height; y++) {
        for (let x = 0; x < this.room.width; x++) {
          const tileId = layer[y * this.room.width + x];
          const color = getTileColor(tileId);
          if (!color) continue;
          ctx.fillStyle = color;
          ctx.fillRect(ox + x * tileSize, oy + y * tileSize, tileSize, tileSize);
        }
      }

      for (let i = 0; i < this.interactables.length; i++) {
        const item = this.interactables[i];
        let color = "#cccccc";
        if (item.type === INTERACTABLE_TYPES.NPC) color = "#f1c40f";
        else if (item.type === INTERACTABLE_TYPES.PORTAL) color = "#8e44ad";
        else if (item.type === INTERACTABLE_TYPES.EXIT) color = "#e74c3c";
        else if (item.type === INTERACTABLE_TYPES.SAVE_POINT) color = "#2ecc71";
        else if (item.type === INTERACTABLE_TYPES.SUBMIT_POINT) color = "#1abc9c";
        ctx.fillStyle = color;
        ctx.fillRect(ox + item.x, oy + item.y, item.width, item.height);
      }

      const px = ox + this.player.x;
      const py = oy + this.player.y;
      ctx.fillStyle = "#3a7bd5";
      ctx.fillRect(px, py, this.player.width, this.player.height);

      if (this.currentInteractable && !this.dialogue.active) {
        let prompt = "Press E to interact";
        const t = this.currentInteractable.type;
        if (t === INTERACTABLE_TYPES.EXIT) prompt = typeof window !== "undefined" && window.FVGD_STANDALONE ? "Press E for the game menu" : "Press E to exit to overworld";
        else if (t === INTERACTABLE_TYPES.NPC) prompt = "Press E to talk to " + this.currentInteractable.name;
        else if (t === INTERACTABLE_TYPES.PORTAL) prompt = "Press E to enter your game";
        else if (t === INTERACTABLE_TYPES.SAVE_POINT) prompt = "Press E to save game";
        else if (t === INTERACTABLE_TYPES.SUBMIT_POINT) prompt = "Press E to submit for review";
        drawInteractionPrompt(ctx, prompt);
      } else if (!this.hasExit && !this.dialogue.active) {
        drawInteractionPrompt(ctx, "No exit placed in this home — press Esc to leave");
      }

      if (this.lastSaveMessage) {
        drawInteractionPrompt(ctx, this.lastSaveMessage);
      }

      if (this.dialogue.active) {
        const data = this.resolveDialogue(this.dialogue.key);
        if (data) {
          drawDialogueBox(ctx, data.speaker, data.lines[this.dialogue.lineIndex]);
        }
      }

      drawDebugOverlay(ctx, {
        sceneName: this.name,
        playerX: this.player.x,
        playerY: this.player.y,
        cameraX: 0,
        cameraY: 0,
        collisionCount: this.collisionObjects.length,
        homeCount: homeRegistry.length
      });
    },

    // Dialogue must not stay open when this home is entered again.
    exit() { this.closeDialogue(); }
  };
}

function registerStudentHomeScenes() {
  for (let i = 0; i < studentManifests.length; i++) {
    const pack = studentManifests[i];
    try {
      sceneManager.register(createHomeScene(pack));
    } catch (err) {
      console.error("Could not register home scene for '" + pack.manifest.id + "':", err);
    }
  }
}

</script>
<script>
// TEACHER-OWNED: one animation frame — update the active scene, then draw it.
// The frame is wrapped so a bad pack can never stop the loop from rescheduling.
let lastTime = 0;
let frameErrorCount = 0;
const MAX_FRAME_ERRORS_LOGGED = 10;

function gameLoop(timestamp) {
  try {
    runFrame(timestamp);
  } catch (err) {
    frameErrorCount += 1;
    if (frameErrorCount <= MAX_FRAME_ERRORS_LOGGED) {
      console.error("Frame error (game keeps running):", err);
      if (frameErrorCount === MAX_FRAME_ERRORS_LOGGED) {
        console.error("Further frame errors will not be logged.");
      }
    }
  }

  requestAnimationFrame(gameLoop);
}

function runFrame(timestamp) {
  const deltaTime = timestamp - lastTime;
  lastTime = timestamp;

  updateDebugStats(deltaTime);
  handleDebugInput();

  updateTransition();

  if (!isTransitionBlockingInput()) {
    sceneManager.update(deltaTime);
  }

  draw();
  input.update();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sceneManager.draw(ctx);
  drawTransition(ctx);
  drawPackReport(ctx);
}

</script>
<script>
// TEACHER-OWNED: boot the same home/game scenes used by the Overworld.
// The generated settings choose one pack; no student-specific engine fork exists.
runPackRegistryChecks();
refreshHomeRegistry();
const exportedPack = getStudentPack(window.FVGD_STANDALONE.packId);
if (!exportedPack) {
  throw new Error("Exported pack was rejected. Check the console for its validation errors.");
}
sceneManager.register(standaloneMenu);
// Keep the existing error fallback usable without shipping a class map scene.
sceneManager.scenes.overworld = standaloneMenu;
sceneManager.register(platformerScene);
sceneManager.register(topdownScene);
sceneManager.register(arenaScene);
sceneManager.register(sportsScene);
sceneManager.register(basketballScene);
sceneManager.register(soccerScene);
sceneManager.register(footballScene);
sceneManager.register(ranchScene);
registerStudentHomeScenes();
loadLocal(1);
markHomeVisited(exportedPack.manifest.id);
sceneManager.changeSceneImmediate(standaloneHomeName());
requestAnimationFrame(gameLoop);

</script>
